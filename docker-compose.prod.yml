# EC2 운영용 compose.
# 로컬 개발용은 docker-compose.yml 이다.
#
# CD 워크플로가 이 파일을 EC2 의 ~/app/ 으로 복사하고,
# 같은 디렉터리에 .env 를 GitHub Secrets 값으로 만들어 넣은 뒤 실행한다.
#
# 직접 실행할 일이 있으면 ~/app 에서:
#   docker compose -f docker-compose.prod.yml up -d

services:
  mariadb:
    image: mariadb:11
    container_name: petnow-mariadb
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: petnow
      MARIADB_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}

    volumes:
      # named volume 이라 컨테이너를 갈아끼워도 데이터가 남는다.
      - mariadb-data:/var/lib/mysql

    # 로컬 compose 와 달리 3306 을 호스트로 열지 않는다.
    # 앱 컨테이너만 내부 네트워크로 붙으면 되고,
    # 열어두면 외부에 그대로 노출된다.

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    # CD 워크플로가 .env 에 커밋 SHA 태그가 붙은 이미지 주소를 써준다.
    image: ${APP_IMAGE:?APP_IMAGE is required}

    container_name: petnow-app
    restart: unless-stopped

    depends_on:
      mariadb:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: prod

      # DB_HOST 는 compose 서비스명이라 고정이다.
      DB_HOST: mariadb
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      FLYWAY_BASELINE_VERSION: ${FLYWAY_BASELINE_VERSION:-4}

      # 카카오 지도 표시(Web SDK)
      # 도로명 주소 지오코딩(Local REST API)
      KAKAO_MAP_JAVASCRIPT_KEY: ${KAKAO_MAP_JAVASCRIPT_KEY:?KAKAO_MAP_JAVASCRIPT_KEY is required}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?KAKAO_REST_API_KEY is required}

      # 카카오 로그인(#215). client_id 는 REST API 키와 같은 값이지만 앱을 분리할 여지를
      # 두려고 따로 받는다. client_secret 은 콘솔의 앱 설정 > 보안에서 "Client Secret 사용" 이
      # ON 이라 필수이고, 없으면 토큰 발급이 KOE010 으로 떨어진다.
      # 둘 다 없으면 앱이 기동조차 못 하므로(placeholder 해결 실패) required 로 미리 막는다.
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID is required}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?KAKAO_CLIENT_SECRET is required}

      # 기존 place_addresses 의 빈 좌표를 채우는 일회성 백필. (#265)
      # 평소에는 꺼져 있어야 한다. 켠 채로 두면 재배포·재기동 때마다 카카오 API 를 다시 부른다.
      # 켜는 법 — ~/app/.env 에 KAKAO_LOCAL_API_BACKFILL_ENABLED=true 를 넣고
      #   docker compose -f docker-compose.prod.yml up -d
      #   docker compose -f docker-compose.prod.yml logs app | grep 백필
      # 로그로 결과를 확인한 뒤 .env 에서 그 줄을 지우고 다시 up -d 한다.
      # 배포 워크플로는 이 두 값을 내보내지 않으므로 EC2 의 .env 가 그대로 이긴다.
      KAKAO_LOCAL_API_BACKFILL_ENABLED: ${KAKAO_LOCAL_API_BACKFILL_ENABLED:-false}
      KAKAO_LOCAL_API_BACKFILL_BATCH_SIZE: ${KAKAO_LOCAL_API_BACKFILL_BATCH_SIZE:-100}

      # S3 업로드용.
      # AWS 자격증명은 넣지 않는다.
      # EC2 인스턴스 프로파일(IAM Role)에서 SDK가 가져간다.
      AWS_S3_REGION: ${AWS_S3_REGION:?AWS_S3_REGION is required}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      AWS_S3_BASE_URL: ${AWS_S3_BASE_URL:?AWS_S3_BASE_URL is required}

    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mariadb-data:
