# EC2 운영용 compose. 로컬 개발용은 docker-compose.yml 이다.
#
# CD 워크플로가 이 파일을 EC2 의 ~/app/ 으로 복사하고,
# 같은 디렉터리에 .env 를 GitHub Secrets 값으로 만들어 넣은 뒤 실행한다.
# 직접 실행할 일이 있으면 ~/app 에서:
#   docker compose -f docker-compose.prod.yml up -d

services:
  mariadb:
    image: mariadb:11
    container_name: petnow-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: petnow
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      # named volume 이라 컨테이너를 갈아끼워도 데이터가 남는다.
      - mariadb-data:/var/lib/mysql
    # 로컬 compose 와 달리 3306 을 호스트로 열지 않는다.
    # 앱 컨테이너만 내부 네트워크로 붙으면 되고, 열어두면 외부에 그대로 노출된다.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    # CD 워크플로가 .env 에 커밋 SHA 태그가 붙은 이미지 주소를 써준다.
    image: ${APP_IMAGE}
    container_name: petnow-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # application-prod.yaml 이 읽는 값들.
      # DB_HOST 는 compose 서비스명이라 고정이다.
      DB_HOST: mariadb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      FLYWAY_BASELINE_VERSION: ${FLYWAY_BASELINE_VERSION:-4}
      # 카카오 지도 표시(Web SDK)와 도로명 주소 지오코딩(Local REST API).
      KAKAO_MAP_JAVASCRIPT_KEY: ${KAKAO_MAP_JAVASCRIPT_KEY}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      # S3 업로드용. 자격증명은 넣지 않는다 —
      # EC2 인스턴스 프로파일(IAM Role)에서 SDK 가 알아서 가져간다.
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_BASE_URL: ${AWS_S3_BASE_URL}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mariadb-data:
