# =====================================================================
# 운영(prod) 설정 - Git 관리 대상
#
# 접속 정보는 이 파일에 절대 하드코딩하지 않는다.
# 서버의 환경변수로 주입한다.
#
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
#
# 실행 예:
#   SPRING_PROFILES_ACTIVE=prod java -jar petNow.jar
# =====================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:petnow}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}

  thymeleaf:
    cache: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: info
    com.example.petnow: info
