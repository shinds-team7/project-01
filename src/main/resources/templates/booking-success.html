<!DOCTYPE html>
<!--/*
  ⚠ 매핑 없는 화면. 프로토타입의 "SUCCESS" 를 결제 완료 버전으로 쓰려고 만든 사본이다.

  실제로 쓰이는 예약 완료 화면은 reservations/success.html 이고
  ReservationController 의 GET /reservation/success 가 그걸 그린다.
  결제 단계를 살릴 때 payment.html 과 짝으로 쓰라고 앱 셸로만 옮겨 뒀다.
  결제 화면을 안 살리기로 하면 payment.html 과 함께 지우면 된다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('결제 완료', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav success-screen">
    <span class="success-mark"><span class="ico" aria-hidden="true">check</span></span>

    <h1>결제가 완료되었어요</h1>
    <p>호스트 승인 후 예약이 확정됩니다.<br>결과는 예약 내역에서 확인할 수 있어요.</p>

    <div class="success-summary">
        <strong th:text="${place?.name} ?: '예약한 공간'">예약한 공간</strong>
        <small th:text="${stayInfo} ?: '이용 일정과 결제 금액이 들어갑니다'">이용 일정과 결제 금액이 들어갑니다</small>
    </div>

    <div class="success-actions">
        <a class="btn btn-dark btn-block" th:href="@{/reservation/list}">예약 내역 보기</a>
        <a class="btn btn-ghost btn-block" th:href="@{/home}">홈으로 돌아가기</a>
    </div>
</main>
</body>
</html>
