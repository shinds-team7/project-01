<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('내 호스팅 장소', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav">
    <div class="topbar has-line">
        <a class="topbar-back" th:href="@{/mypage}" aria-label="마이페이지로 돌아가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>내 호스팅 장소</h1>
    </div>

    <div class="screen">
        <p class="home-sub">등록한 장소와 게시 상태를 확인할 수 있어요.</p>

        <div class="empty" th:if="${#lists.isEmpty(places)}">
            <span class="ico" aria-hidden="true">home_work</span>
            <strong>등록된 장소가 없어요</strong>
            <p>첫 장소를 등록하면 예약을 받을 수 있어요.</p>
            <a class="btn btn-primary" th:href="@{/host/create}">장소 등록하기</a>
        </div>

        <div class="list" th:unless="${#lists.isEmpty(places)}">
            <a class="card list-row" th:each="place : ${places}"
               th:href="@{/places/{id}(id=${place.id})}"
               th:aria-label="|${place.name} 상세보기|">
                <span class="list-row-label">
                    <strong th:text="${place.name}">장소명</strong>
                    <small>장소 ID <span th:text="${place.id}">0</span></small>
                </span>
                <span class="badge"
                      th:if="${place.status != null}"
                      th:classappend="${place.status.name() == 'PUBLISHED'} ? 'badge-green' : 'badge-warn'"
                      th:text="${place.status.label}">게시</span>
                <span class="badge" th:if="${place.status == null}">상태 없음</span>
            </a>
        </div>

        <!--/* 빈 상태 카드에 이미 등록 버튼이 있으므로 목록이 있을 때만 하단 버튼을 둔다 */-->
        <a class="btn btn-ghost btn-block" th:unless="${#lists.isEmpty(places)}"
           th:href="@{/host/create}">
            <span class="ico" aria-hidden="true">add</span> 새 장소 등록하기
        </a>
    </div>
</main>
</body>
</html>
