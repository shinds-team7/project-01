<!DOCTYPE html>
<!--/*
  호스트 리뷰 관리 = 프로토타입의 "HOST REVIEWS" 화면.

  GET /host/places/{placeId}/reviews 가 이 화면을 그린다. HostController 가 장소 주인인지
  확인한 뒤에만 열어 준다. 보호자용 GET /reviews/place/{placeId}(reviews/list.html)는
  로그인 없이도 열리는 공개 화면이라 작성자 표기 없이 후기만 보여준다.

  ${place} 는 Place 엔티티, ${reviews} 는 ReviewResponse 목록(최신순)이다.
  평균 별점은 집계 쿼리 대신 받아 온 목록으로 화면에서 직접 낸다. 이 화면이 장소 하나의
  리뷰를 다 받아오므로 목록과 평균이 어긋날 일이 없다.

  예전에 쓰던 review.guestName · review.readByHost · review.replyContent · reviewCount ·
  hasMore 는 서버에 없어 걷어냈다. 답글 달기 · 읽음 처리는 답글 도메인이 생기면 붙인다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('리뷰 관리', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav">
    <div class="topbar">
        <a class="topbar-back" th:href="@{/host}" aria-label="호스트 홈으로 돌아가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1 th:text="${place != null} ? ${place.name} : '리뷰 관리'">리뷰 관리</h1>
    </div>

    <div class="screen"
         th:with="total=${reviews == null} ? 0 : ${#lists.size(reviews)}">

        <div class="review-summary" th:if="${total > 0}"
             th:with="avg=${#aggregates.avg(reviews.![rating])}">
            <span class="score" th:text="${#numbers.formatDecimal(avg, 1, 2)}">4.92</span>
            <div>
                <div class="stars" aria-hidden="true">
                    <span class="ico" th:each="i : ${#numbers.sequence(1, 5)}"
                          th:classappend="${avg >= i} ? '' : 'is-empty'">star</span>
                </div>
                <small th:text="'리뷰 ' + ${total} + '개'">리뷰 128개</small>
            </div>
        </div>

        <div class="empty" th:if="${total == 0}">
            <span class="ico" aria-hidden="true">reviews</span>
            <strong>아직 등록된 리뷰가 없어요</strong>
            <p>돌봄이 끝난 예약에 보호자가 후기를 남기면 여기에 모입니다.</p>
        </div>

        <div class="review-list" style="margin-top:18px" th:if="${total > 0}">
            <article class="review-item" th:each="review : ${reviews}">
                <div class="review-item-head">
                    <span class="who">
                        <span class="avatar is-sm"
                              style="width:34px;height:34px;border-radius:50%;background:var(--sand);color:#b9b1a2;display:flex;align-items:center;justify-content:center">
                            <span class="ico is-filled" aria-hidden="true" style="font-size:19px">person</span>
                        </span>
                        <span th:text="'보호자 #' + ${review.memberId}">보호자</span>
                    </span>
                    <span class="when">
                        <span class="ico" aria-hidden="true">star</span>
                        <span th:text="${review.rating}">5</span>
                        <!--/*
                          ReviewResponse 에 작성 시각이 없어 이용일(reservations.check_in_at)을 쓴다.
                          "언제 묵고 남긴 후기인지"가 호스트에게는 작성 시각보다 쓸모 있다.
                        */-->
                        <span th:if="${review.checkInAt != null}"
                              th:text="' · ' + ${#temporals.format(review.checkInAt, 'yyyy.MM.dd')} + ' 이용'"> · 2026.07.20 이용</span>
                    </span>
                </div>
                <p class="review-item-body" th:text="${review.content}">후기 내용</p>
            </article>
        </div>
    </div>
</main>
</body>
</html>
