<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호스팅 장소 관리</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f6f7f8;
            color: #1f2937;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        main {
            width: min(100% - 32px, 720px);
            margin: 0 auto;
            padding: 40px 0;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 26px;
        }

        .page-header p {
            margin: 8px 0 0;
            color: #6b7280;
            font-size: 14px;
        }

        .empty-state,
        .place-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
        }

        .empty-state {
            padding: 48px 24px;
            color: #6b7280;
            text-align: center;
        }

        .place-list {
            display: grid;
            gap: 14px;
        }

        .place-card {
            padding: 20px;
        }

        .place-card__top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .place-card h2 {
            margin: 0;
            font-size: 18px;
        }

        .place-id {
            margin: 10px 0 0;
            color: #9ca3af;
            font-size: 12px;
        }

        .status-badge {
            flex: none;
            padding: 6px 10px;
            border-radius: 999px;
            background: #eef2f7;
            color: #4b5563;
            font-size: 12px;
            font-weight: 700;
        }

        .status-published {
            background: #e9f8ef;
            color: #16834a;
        }

        .status-pending {
            background: #fff5dc;
            color: #9a6700;
        }
    </style>
</head>
<body>
<main>
    <header class="page-header">
        <h1>내 호스팅 장소</h1>
        <p>등록한 장소와 게시 상태를 확인할 수 있습니다.</p>
    </header>

    <section class="empty-state" th:if="${#lists.isEmpty(places)}">
        등록된 장소가 없습니다.
    </section>

    <section class="place-list" th:unless="${#lists.isEmpty(places)}">
        <article class="place-card" th:each="place : ${places}">
            <div class="place-card__top">
                <h2 th:text="${place.name}">장소명</h2>

                <span th:switch="${place.status != null ? place.status.name() : ''}">
                    <span class="status-badge status-published"
                          th:case="'PUBLISHED'"
                          th:text="${place.status.label}">게시</span>
                    <span class="status-badge status-pending"
                          th:case="'PENDING'"
                          th:text="${place.status.label}">임시저장</span>
                    <span class="status-badge"
                          th:case="*">상태 없음</span>
                </span>
            </div>

            <p class="place-id">
                장소 ID:
                <span th:text="${place.id}">0</span>
            </p>
        </article>
    </section>
</main>
</body>
</html>
