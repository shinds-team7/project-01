<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장소 등록 완료</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f6f7f8;
            color: #1f2937;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        main {
            width: min(100%, 440px);
            padding: 48px 32px;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            background: #ffffff;
            text-align: center;
            box-shadow: 0 12px 32px rgba(31, 41, 55, 0.08);
        }

        .check {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e9f8ef;
            color: #16834a;
            font-size: 32px;
            font-weight: 700;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        p {
            margin: 12px 0 0;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<main>
    <div class="check" aria-hidden="true">✓</div>
    <h1>장소 등록이 완료되었습니다.</h1>
    <p>호스팅 장소 정보가 정상적으로 저장되었습니다.</p>
</main>
</body>
</html>
