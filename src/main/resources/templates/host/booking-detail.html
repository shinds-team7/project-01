<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#22a45c">
    <title>예약 요청 상세 | Pet NOW</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../../static/css/pet-now.css" th:href="@{/css/pet-now.css}">
    <link rel="stylesheet" href="../../static/css/app-flow.css" th:href="@{/css/app-flow.css}">
    <script defer src="../../static/js/app-flow.js" th:src="@{/js/app-flow.js}"></script>
</head>
<body class="flow-page">
<header class="site-header is-scrolled" data-header>
    <div class="header-inner">
        <a class="brand" href="/places" aria-label="Pet NOW 홈">
            <span class="brand-mark material-symbols-rounded" aria-hidden="true">pets</span>
            <span>Pet <b>NOW</b></span>
        </a>
        <div class="header-actions">
            <a class="profile-button" href="/mypage" aria-label="마이페이지">
                <span class="profile-avatar">지</span>
                <span class="profile-copy"><small>반가워요</small><strong>지우 보호자님</strong></span>
            </a>
        </div>
    </div>
</header>

<main class="flow-shell">
    <div class="flow-topbar">
        <a class="flow-back" th:href="@{/host(tab='booking')}" aria-label="뒤로 가기">
            <span class="material-symbols-rounded" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>예약 요청 상세</h1>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;">
        <strong style="font-size:20px;color:var(--ink-deep);font-weight:800;">예약 요청</strong>
        <span th:style="'font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:8px;'
              + (${booking.waiting}
                 ? 'background:var(--pet-orange-soft);color:#ad5919;'
                 : 'background:var(--pet-green-soft);color:var(--pet-green-dark);')"
              style="font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:8px;background:var(--pet-orange-soft);color:#ad5919;"
              th:text="${booking.status}">승인 대기</span>
    </div>

    <div class="media-placeholder" style="height:150px;border-radius:var(--radius-md);margin-top:16px;">
        <span class="material-symbols-rounded" aria-hidden="true">weekend</span>
    </div>
    <strong style="display:block;margin-top:16px;color:var(--ink-deep);font-size:17px;font-weight:800;" th:text="${booking.place}">성수 단독주택 마당</strong>

    <div class="flow-divider"></div>

    <p class="flow-section-title">예약자 정보</p>
    <div class="pet-row">
        <span class="avatar"><span class="material-symbols-rounded" aria-hidden="true">person</span></span>
        <span class="who">
            <strong th:text="${booking.guestName}">김하늘</strong>
            <small>예약 3회 · 재예약 고객</small>
        </span>
        <button type="button" class="link-action" data-pending-feature="게스트 문의"
                style="border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:700;color:#374151;display:flex;align-items:center;gap:5px;">
            <span class="material-symbols-rounded" aria-hidden="true" style="font-size:16px;">chat_bubble</span>문의</button>
    </div>

    <div class="flow-divider"></div>

    <p class="flow-section-title">반려견 정보</p>
    <div class="pet-row" style="background:var(--soft);border:0;">
        <span class="avatar"><span class="material-symbols-rounded" aria-hidden="true">pets</span></span>
        <span class="who"><strong>반려견</strong><small th:text="${booking.petLine}">초코 · 푸들 · 6kg · 소형</small></span>
    </div>
    <p style="font-size:13px;line-height:1.7;color:#4b5563;margin-top:14px;background:var(--soft);border-radius:14px;padding:14px;">"분리불안이 조금 있어요. 자주 확인 부탁드립니다 🐾"</p>

    <div class="flow-divider"></div>

    <p class="flow-section-title">일정 및 결제</p>
    <div class="price-breakdown" style="border-top:0;">
        <div class="row"><span>이용 일시</span><span th:text="${booking.when}">2026.08.09 (일) 13:00~18:00</span></div>
        <div class="row"><span>예상 정산액</span><strong th:text="${#numbers.formatInteger(booking.estimatedPayout, 0, 'COMMA')} + '원'">57,000원</strong></div>
    </div>
</main>

<div class="sticky-footer" th:if="${booking.waiting}">
    <button class="flow-cta" type="button" data-pending-feature="예약 거절"
            style="flex:1;background:#fdeced;color:var(--danger);border:1px solid #f2c3c4;">거절하기</button>
    <button class="flow-cta is-green" type="button" data-pending-feature="예약 승인" style="flex:1.4;">승인하기</button>
</div>

<div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
