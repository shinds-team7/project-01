<!DOCTYPE html>
<!--/*
  호스트 홈 = 프로토타입의 "HOST HOME" 화면 (예약 / 리뷰 / 장소 3개 탭).

  ⚠ 매핑 없는 화면. 지금 열리는 호스트 화면은 host/manage.html 이고
  GET /host 가 그걸 그린다. manage 는 장소 목록만 있는 축소판이다.

  이식하면서 예전에 쓰던 bookings·req.* 처럼 어디에도 없는 모델을 버리고
  실제로 내려오는 ${places}(HostPlaceListResponse: id·name·status)에 맞췄다.
  예약·리뷰 탭은 호스트용 조회 API 가 아직 없어 빈 상태로 둔다.

  살리려면 GET /host?tab=... 매핑을 만들고
  호스트 예약 목록 / 호스트 리뷰 목록 서비스를 붙이면 된다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('호스트 홈', 'my', ~{::main})}">
<body>
<main id="main-content" class="app-main" th:with="activeTab=${tab} ?: 'places'">
    <div class="screen">
        <div class="host-head">
            <h1>호스트 홈</h1>
            <a class="host-mode-link" th:href="@{/mypage}">
                사용자 모드 <span class="ico" aria-hidden="true">chevron_right</span>
            </a>
        </div>

        <div class="tab-row">
            <a th:href="@{/host(tab='booking')}" th:classappend="${activeTab == 'booking'} ? 'is-active'">예약 요청</a>
            <a th:href="@{/host(tab='reviews')}" th:classappend="${activeTab == 'reviews'} ? 'is-active'">리뷰</a>
            <a th:href="@{/host(tab='places')}" th:classappend="${activeTab == 'places'} ? 'is-active'">내 호스팅</a>
        </div>

        <!--/* 예약 요청 탭 — 호스트용 예약 조회 API 가 없어 아직 비어 있다 */-->
        <div th:if="${activeTab == 'booking'}" class="empty">
            <span class="ico" aria-hidden="true">event_note</span>
            <strong>예약 요청을 불러올 수 없어요</strong>
            <p>호스트용 예약 조회 API 가 연결되면 여기에 표시됩니다.</p>
        </div>

        <!--/* 리뷰 탭 — 호스트용 리뷰 조회 API 가 없어 아직 비어 있다 */-->
        <div th:if="${activeTab == 'reviews'}" class="empty">
            <span class="ico" aria-hidden="true">reviews</span>
            <strong>리뷰를 불러올 수 없어요</strong>
            <p>호스트용 리뷰 조회 API 가 연결되면 여기에 표시됩니다.</p>
        </div>

        <th:block th:if="${activeTab == 'places'}">
            <div class="section-head">
                <h2 class="section-title">내 호스팅</h2>
                <a class="section-more" th:href="@{/host/create}">+ 장소 등록</a>
            </div>

            <div class="empty" th:if="${places == null or #lists.isEmpty(places)}">
                <span class="ico" aria-hidden="true">home_work</span>
                <strong>등록된 장소가 없어요</strong>
                <p>첫 장소를 등록하면 예약을 받을 수 있어요.</p>
            </div>

            <div class="card-stack" th:unless="${places == null or #lists.isEmpty(places)}">
                <div class="card host-place-card" th:each="place : ${places}">
                    <div class="place-summary">
                        <div class="media">
                            <span class="ico" aria-hidden="true">weekend</span>
                        </div>
                        <div class="place-summary-copy">
                            <div class="place-summary-head">
                                <strong th:text="${place.name}">성수 단독주택 마당</strong>
                                <span class="badge"
                                      th:if="${place.status != null}"
                                      th:classappend="${place.status.name() == 'PUBLISHED'} ? 'badge-green' : 'badge-warn'"
                                      th:text="${place.status.label}">게시 중</span>
                            </div>
                        </div>
                    </div>
                    <div class="host-place-actions">
                        <a class="btn btn-ghost" th:href="@{/places/{id}(id=${place.id})}">
                            <span class="ico" aria-hidden="true">visibility</span>공개 화면 보기
                        </a>
                        <a class="btn btn-ghost" th:href="@{/reviews/place/{id}(id=${place.id})}">
                            <span class="ico" aria-hidden="true">reviews</span>리뷰 보기
                        </a>
                    </div>
                </div>
            </div>

            <a class="btn btn-dashed" th:href="@{/host/create}">
                <span class="ico" aria-hidden="true">add</span> 새 장소 등록하기
            </a>
        </th:block>
    </div>
</main>
</body>
</html>
