<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#22a45c">
    <title>반려견 등록 | Pet NOW</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../static/css/pet-now.css" th:href="@{/css/pet-now.css}">
    <link rel="stylesheet" href="../static/css/host-place.css" th:href="@{/css/host-place.css}">
    <link rel="stylesheet" href="../static/css/app-flow.css" th:href="@{/css/app-flow.css}">
    <script defer src="../static/js/app-flow.js" th:src="@{/js/app-flow.js}"></script>
    <script defer src="../static/js/pet-form.js" th:src="@{/js/pet-form.js}"></script>
</head>
<body class="flow-page">
<a class="skip-link" href="#pet-form">등록 양식으로 바로가기</a>

<header class="site-header is-scrolled" data-header>
    <div class="header-inner">
        <a class="brand" href="/mypage" aria-label="Pet NOW 홈">
            <span class="brand-mark material-symbols-rounded" aria-hidden="true">pets</span>
            <span>Pet <b>NOW</b></span>
        </a>
        <div class="header-actions">
            <a class="profile-button" href="/mypage" aria-label="마이페이지">
                <span class="profile-avatar">지</span>
                <span class="profile-copy"><small>반가워요</small><strong>지우 보호자님</strong></span>
            </a>
        </div>
    </div>
</header>

<main class="flow-shell">
    <div class="flow-topbar">
        <a class="flow-back" href="/mypage#pets" aria-label="뒤로 가기">
            <span class="material-symbols-rounded" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>반려견 등록</h1>
    </div>

    <form id="pet-form" th:action="@{/pet/create}"
          method="post">
        <div style="text-align:center;">
            <div class="avatar-upload">
                <span class="material-symbols-rounded" aria-hidden="true">pets</span>
                <span class="material-symbols-rounded is-camera" aria-hidden="true">photo_camera</span>
            </div>
        </div>

        <div class="field" style="margin-top:28px;">
            <div class="field-label"><label for="pet-name">이름</label></div>
            <input class="control" id="pet-name" name="name" type="text" placeholder="예) 초코" required maxlength="20">
        </div>

        <div class="split-fields">

            <div class="field">
                <div class="field-label"><label for="pet-weight">몸무게</label></div>
                <div class="unit-control">
                    <input id="pet-weight" name="weight" type="number" step="0.1" min="0" placeholder="6">
                    <span>kg</span>
                </div>
            </div>
        </div>

        <div class="field">
            <div class="field-label"><label for="pet-birth-year">출생 연도</label></div>
            <select class="control" id="pet-birth-year" name="birthYear">
                <option value="">모름 · 추정 나이 선택</option>
                <option th:each="y : ${#numbers.sequence(2026, 2010, -1)}" th:value="${y}" th:text="${y} + '년생'">2023년생</option>
            </select>
        </div>

        <div class="field">
            <div class="field-label"><span>크기</span></div>
            <input type="hidden" name="size" value="SMALL" data-choice-input="size">
            <div class="choice-row" data-choice-group="size">
                <button type="button" class="is-active" aria-pressed="true" data-value="SMALL">소형견</button>
                <button type="button" aria-pressed="false" data-value="MEDIUM">중형견</button>
                <button type="button" aria-pressed="false" data-value="LARGE">대형견</button>
            </div>
        </div>

        <div class="field">
            <div class="field-label"><span>성별</span></div>
            <input type="hidden" name="sex" value="남아" data-choice-input="sex">
            <div class="choice-row" data-choice-group="sex">
                <button type="button" class="is-active" aria-pressed="true" data-value="남아">남아</button>
                <button type="button" aria-pressed="false" data-value="여아">여아</button>
            </div>
        </div>

        <label class="check-row">
            <input type="checkbox" name="isNeutered" checked>중성화 완료
        </label>

        <div class="field" style="margin-top:24px;">
            <div class="field-label"><label for="pet-note">메모 <span>선택</span></label></div>
            <textarea class="control" id="pet-note" name="memo" rows="4"
                      placeholder="예) 낯선 사람을 조금 무서워해요. 닭고기 알레르기가 있고, 산책은 하루 2번 필요합니다."></textarea>
        </div>

        <button class="flow-cta is-block is-green" type="submit" style="margin-top:30px;">등록하기</button>
    </form>
</main>

<div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
