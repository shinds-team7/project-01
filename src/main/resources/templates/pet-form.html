<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('반려동물 등록', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav pet-editor-page">
    <div class="topbar has-line pet-editor-topbar">
        <a class="topbar-back" th:href="@{/mypage}" aria-label="마이페이지로 돌아가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>반려동물 등록</h1>
    </div>

    <form class="pet-editor" th:action="@{/pet/create}" method="post">
        <section class="pet-editor-intro" aria-labelledby="pet-create-title">
            <span class="pet-editor-portrait" aria-hidden="true">
                <span class="ico is-filled">pets</span>
                <i class="ico">add_a_photo</i>
            </span>
            <div>
                <span class="pet-editor-kicker">NEW FAMILY</span>
                <h2 id="pet-create-title">새 가족을<br>소개해 주세요</h2>
                <p>돌봄에 꼭 필요한 정보만 먼저 받을게요. 나중에 언제든 바꿀 수 있어요.</p>
            </div>
        </section>

        <div class="pet-editor-fields">
            <div class="field pet-editor-name">
                <label for="create-name">이름 <span class="req">필수</span></label>
                <input class="control" id="create-name" name="name" type="text"
                       placeholder="예: 초코" maxlength="20" autocomplete="off" required>
            </div>

            <fieldset class="field pet-editor-fieldset">
                <legend class="field-label">크기 <span class="req">필수</span></legend>
                <div class="choice-row pet-size-choices">
                    <label class="choice">
                        <input type="radio" name="size" value="SMALL" required>
                        <span><i class="ico" aria-hidden="true">pets</i><b>소형</b><small>10kg 미만</small></span>
                    </label>
                    <label class="choice">
                        <input type="radio" name="size" value="MEDIUM">
                        <span><i class="ico" aria-hidden="true">pets</i><b>중형</b><small>10–25kg</small></span>
                    </label>
                    <label class="choice">
                        <input type="radio" name="size" value="LARGE">
                        <span><i class="ico" aria-hidden="true">pets</i><b>대형</b><small>25kg 이상</small></span>
                    </label>
                </div>
            </fieldset>

            <div class="pet-editor-split">
                <div class="field">
                    <label for="create-birth-year">태어난 해</label>
                    <select class="control" id="create-birth-year" name="birthYear">
                        <option value="">선택해 주세요</option>
                        <option th:each="year : ${#numbers.sequence(#dates.year(#dates.createNow()), 2000, -1)}"
                                th:value="${year}" th:text="${year} + '년'">2024년</option>
                    </select>
                </div>
                <div class="field">
                    <label for="create-weight">몸무게</label>
                    <span class="pet-unit-control">
                        <input class="control" id="create-weight" name="weight" type="number"
                               min="0.1" max="100" step="0.1" inputmode="decimal" placeholder="4.2">
                        <span>kg</span>
                    </span>
                </div>
            </div>

            <fieldset class="field pet-editor-fieldset">
                <legend class="field-label">성별</legend>
                <div class="choice-row pet-sex-choices">
                    <label class="choice"><input type="radio" name="sex" value="M"><span>남아</span></label>
                    <label class="choice"><input type="radio" name="sex" value="F"><span>여아</span></label>
                </div>
            </fieldset>

            <input type="hidden" name="_isNeutered" value="on">
            <label class="pet-toggle">
                <input type="checkbox" name="isNeutered" value="true">
                <span><strong>중성화를 했어요</strong><small>호스트에게 미리 알려드려요</small></span>
                <i aria-hidden="true"></i>
            </label>

            <div class="field">
                <label for="create-memo">돌봄 메모 <span class="opt">선택</span></label>
                <textarea class="control pet-memo" id="create-memo" name="memo" rows="5" maxlength="500"
                          placeholder="좋아하는 것, 낯선 환경에서의 반응, 주의할 점을 알려주세요."></textarea>
                <p class="field-hint">예약할 때 호스트가 아이를 이해하는 데 도움이 돼요.</p>
            </div>

            <div class="pet-editor-actions">
                <a class="btn btn-ghost" th:href="@{/mypage}">취소</a>
                <button class="btn btn-primary" type="submit">가족으로 등록하기</button>
            </div>
        </div>
    </form>
</main>
</body>
</html>
