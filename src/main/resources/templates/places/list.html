<!DOCTYPE html>
<!--/*
  장소 목록 = 프로토타입의 "SEARCH LIST + MAP" 화면.

  프로토타입 카드의 지역·리뷰 수는 PlaceListResponse 에 아직 없다. (#182 의 함정 1)
  평점은 average_rating 을 실어 보여주고, 나머지는 호스트 닉네임·수용 조건·시간당 요금으로 채웠다.

  검색창은 GET /search(키워드), 조건 칩은 홈의 검색 조건 카드(→ GET /nearby),
  지도 보기는 GET /nearby 로 간다. 정렬은 이 화면이 직접 받는다(?sort=price|rating).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('펫시터 찾기', 'search', ~{::main})}">
<body>
<main id="main-content" class="app-main has-cta">
    <div class="screen">
        <div class="search-bar">
            <a class="search-field" th:href="@{/search}">
                <span class="ico" aria-hidden="true">search</span>
                <span>지역, 호스트 이름으로 검색해보세요</span>
            </a>
            <a class="search-submit" th:href="@{/search}" aria-label="검색">
                <span class="ico" aria-hidden="true">search</span>
            </a>
        </div>

        <!--/*
          조건 칩은 홈의 검색 조건 카드로 보낸다. 지역·날짜·시간·반려견·유형을 고르는 곳이
          거기 하나뿐이고, 고른 결과는 GET /nearby 가 받는다. (#7)
          예전에는 셋 다 /search 로 갔는데, /search 는 한 줄 검색어만 받아서
          지역이나 날짜를 고를 방법이 없었다.
        */-->
        <div class="chip-row filter-row">
            <a class="chip" th:href="@{/home}">
                <span class="ico" aria-hidden="true">location_on</span>지역 선택
                <span class="ico" aria-hidden="true">expand_more</span>
            </a>
            <a class="chip" th:href="@{/home}">
                <span class="ico" aria-hidden="true">calendar_today</span>날짜 선택
            </a>
            <a class="chip" th:href="@{/home}">
                <span class="ico" aria-hidden="true">tune</span>상세 필터
            </a>
        </div>

        <!--/*
          정렬. 서버의 allowlist(PlaceMapper.findByFilter)와 같은 세 값만 보낸다.
          .sort-row 는 space-between 이라 개수는 왼쪽, 칩은 오른쪽에 붙는다.
          어느 칩이 켜질지는 컨트롤러가 정규화해 넘긴 currentSort 가 정한다.
        */-->
        <div class="sort-row">
            <p class="result-count" th:text="'총 ' + ${#lists.size(places)} + '개의 공간'">총 0개의 공간</p>
            <div class="chip-row" role="tablist" aria-label="정렬 기준">
                <a class="chip" role="tab" th:href="@{/places}"
                   th:classappend="${currentSort == 'latest'} ? ' is-active'"
                   th:aria-selected="${currentSort == 'latest'}">최신순</a>
                <a class="chip" role="tab" th:href="@{/places(sort='price')}"
                   th:classappend="${currentSort == 'price'} ? ' is-active'"
                   th:aria-selected="${currentSort == 'price'}">가격 낮은순</a>
                <a class="chip" role="tab" th:href="@{/places(sort='rating')}"
                   th:classappend="${currentSort == 'rating'} ? ' is-active'"
                   th:aria-selected="${currentSort == 'rating'}">별점 높은순</a>
            </div>
        </div>

        <div class="place-list" th:unless="${#lists.isEmpty(places)}">
            <!--/*
              카드는 링크 하나가 통째로 덮고 찜 버튼만 그 위에 얹힌다 (nearby.html·bookmarks.html 과 같은 구조).
              버튼을 링크 안에 넣으면 찜하려다 상세로 넘어가므로 .bookmark-card 로 감싸고 둘을 형제로 둔다.
            */-->
            <article class="place-card bookmark-card" th:each="place : ${places}">
                <a class="bookmark-card-link" th:href="@{/places/{id}(id=${place.id})}"
                   th:aria-label="|${place.name} 상세보기|">
                    <div class="media">
                        <img th:if="${place.thumbnailUrl != null}" th:src="${place.thumbnailUrl}"
                             th:alt="${place.name}">
                        <span th:unless="${place.thumbnailUrl != null}" class="ico" aria-hidden="true">weekend</span>
                    </div>
                    <div class="place-card-body">
                        <p class="place-card-title" th:text="${place.name}">공간 이름</p>
                        <div class="place-tags">
                            <span class="is-type" th:if="${place.placeType != null}"
                                  th:text="${place.placeType.label}">아파트</span>
                            <span class="is-size" th:if="${place.allowsSmallDog}">소형견</span>
                            <span class="is-size" th:if="${place.allowsMediumDog}">중형견</span>
                            <span class="is-size" th:if="${place.allowsLargeDog}">대형견</span>
                            <span class="is-extra" th:if="${place.providesYard}">마당</span>
                            <span class="is-extra" th:if="${place.providesWalk}">산책</span>
                            <span class="is-extra" th:if="${place.providesHomeCamera}">홈캠</span>
                            <span class="is-extra" th:if="${place.providesRealtimePhoto}">실시간 사진</span>
                        </div>
                        <p class="place-loc">
                            <span class="ico" aria-hidden="true">person</span>
                            <span th:text="${place.nickname}">호스트 닉네임</span>
                        </p>
                        <!--/*
                          평균 별점. 리뷰가 없으면 average_rating 이 0.00 이라 줄 자체를 그리지 않는다.
                          "0.0점"으로 보이면 후기가 나쁜 공간처럼 읽힌다.
                        */-->
                        <p class="rating" th:if="${place.hasRating()}">
                            <span class="ico" aria-hidden="true">star</span>
                            <span th:text="${#numbers.formatDecimal(place.averageRating, 1, 1)}">4.8</span>
                            <span class="sr-only">점</span>
                        </p>
                        <p class="place-price"
                           th:if="${place.hourlyPrice != null}">
                            <span th:text="${#numbers.formatInteger(place.hourlyPrice, 0, 'COMMA')} + '원'">12,000원</span>
                            <small>/ 시간당</small>
                        </p>
                        <p class="place-price" th:if="${place.hourlyPrice == null}">가격 문의</p>
                    </div>
                </a>
                <!--/* 찜. 비로그인으로 누르면 bookmark.js 가 401 을 받아 로그인 화면으로 보낸다. */-->
                <button class="like-btn" type="button"
                        th:classappend="${place.bookmarked} ? ' is-on'"
                        th:data-place-id="${place.id}"
                        th:aria-pressed="${place.bookmarked}"
                        th:aria-label="${place.bookmarked} ? '찜 취소' : '찜하기'"
                        data-bookmark-toggle>
                    <span class="ico" aria-hidden="true">favorite</span>
                </button>
            </article>
        </div>

        <div class="empty" th:if="${#lists.isEmpty(places)}">
            <span class="ico" aria-hidden="true">travel_explore</span>
            <strong>지금은 공개된 공간이 없어요</strong>
            <p>새로 등록된 공간이 공개되면 여기에서 바로 확인할 수 있어요.</p>
        </div>
    </div>

    <a class="map-toggle" th:href="@{/nearby}">
        <span class="ico" aria-hidden="true">map</span>지도 보기
    </a>
    <script th:src="@{/js/bookmark.js}"></script>
</main>
</body>
</html>
