<!DOCTYPE html>
<!--/*
  장소 등록 완료. 프로토타입에는 없는 화면이라 "SUCCESS" 화면의 형태를 빌려 맞췄다.
  GET /places/success 가 그린다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('장소 등록 완료', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav success-screen">
    <span class="success-mark is-green"><span class="ico" aria-hidden="true">done_all</span></span>

    <h1>공간 등록 신청을<br>잘 받았어요</h1>
    <p>아이들이 편안하게 머물 새로운 공간을 소개해주셔서 고맙습니다.</p>

    <ol class="step-timeline">
        <li class="is-done">
            <span><span class="ico" aria-hidden="true">check</span></span>
            <p><strong>등록 접수</strong><small>지금 완료</small></p>
        </li>
        <li>
            <span>2</span>
            <p><strong>운영팀 확인</strong><small>확인 예정</small></p>
        </li>
        <li>
            <span>3</span>
            <p><strong>검색 공개</strong><small>검토 승인 후</small></p>
        </li>
    </ol>

    <div class="success-actions">
        <a class="btn btn-dark btn-block" th:href="@{/host(tab='places')}">내 호스팅 장소 보기</a>
        <a class="btn btn-ghost btn-block" th:href="@{/places/new}">다른 공간 등록</a>
    </div>
</main>
</body>
</html>
