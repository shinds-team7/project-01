<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#22a45c">
    <title>리뷰 쓰기 | Pet NOW</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../../static/css/pet-now.css" th:href="@{/css/pet-now.css}">
    <link rel="stylesheet" href="../../static/css/host-place.css" th:href="@{/css/host-place.css}">
    <link rel="stylesheet" href="../../static/css/app-flow.css" th:href="@{/css/app-flow.css}">
    <script defer src="../../static/js/app-flow.js" th:src="@{/js/app-flow.js}"></script>
</head>
<body class="flow-page">
<a class="skip-link" href="#review-form">작성 양식으로 바로가기</a>

<header class="site-header is-scrolled" data-header>
    <div class="header-inner">
        <a class="brand" href="/places" aria-label="Pet NOW 홈">
            <span class="brand-mark material-symbols-rounded" aria-hidden="true">pets</span>
            <span>Pet <b>NOW</b></span>
        </a>
        <nav class="desktop-nav" aria-label="주요 메뉴">
            <a href="/places#places">펫시터 찾기</a>
            <a href="/places#care">안심 돌봄</a>
            <a href="/places#how-it-works">이용 방법</a>
        </nav>
        <div class="header-actions">
            <a class="profile-button" href="/mypage" aria-label="마이페이지">
                <span class="profile-avatar">지</span>
                <span class="profile-copy"><small>반가워요</small><strong>지우 보호자님</strong></span>
            </a>
        </div>
    </div>
</header>

<main class="flow-shell">
    <div class="flow-topbar">
        <a class="flow-back" href="/mypage#reservations" aria-label="뒤로 가기">
            <span class="material-symbols-rounded" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <div>
            <h1>리뷰 쓰기</h1>
            <small>솔직한 후기는 다른 반려인에게 큰 도움이 돼요</small>
        </div>
    </div>

    <div class="summary-card">
        <div class="media-placeholder"><span class="material-symbols-rounded" aria-hidden="true">weekend</span></div>
        <div class="summary-body">
            <strong th:text="${placeName}">성수 조용한 단독주택 마당</strong>
            <small th:text="${stayInfo}">7월 18일 · 1박 · 초코</small>
        </div>
    </div>

    <p th:if="${submitError}" th:text="${submitError}"
       style="margin-top:16px;padding:13px 16px;border-radius:12px;background:#fdeced;color:var(--danger);font-size:13px;font-weight:700;text-align:center;"></p>

    <form id="review-form" th:action="@{/reviews}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{reservationId}">
        <input type="hidden" name="placeName" th:value="${placeName}">
        <input type="hidden" name="stayInfo" th:value="${stayInfo}">

        <p class="field-error" th:if="${#fields.hasErrors('reservationId')}" th:errors="*{reservationId}"
           style="text-align:center;margin-top:10px;"></p>

        <div class="flow-section" style="text-align:center;">
            <p class="flow-section-title" style="justify-content:center;">이용은 어떠셨나요?</p>
            <div class="star-picker" data-star-picker aria-label="별점 선택">
                <button type="button" aria-label="1점" aria-pressed="false"><span class="material-symbols-rounded">star</span></button>
                <button type="button" aria-label="2점" aria-pressed="false"><span class="material-symbols-rounded">star</span></button>
                <button type="button" aria-label="3점" aria-pressed="false"><span class="material-symbols-rounded">star</span></button>
                <button type="button" aria-label="4점" aria-pressed="false"><span class="material-symbols-rounded">star</span></button>
                <button type="button" aria-label="5점" aria-pressed="false"><span class="material-symbols-rounded">star</span></button>
            </div>
            <p class="rating-label" data-rating-label>별점을 선택해주세요</p>
            <input type="hidden" th:field="*{rating}" data-rating-input>
            <p class="field-error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></p>
        </div>

        <div class="flow-section">
            <div class="field">
                <div class="field-label">
                    <label for="content">후기 내용</label>
                    <span><b data-content-count>0</b>/50</span>
                </div>
                <textarea class="control" id="content" th:field="*{content}" th:errorclass="has-error"
                          maxlength="50" data-count-target="[data-content-count]"
                          placeholder="다른 반려인들에게 도움이 되도록 솔직한 후기를 남겨주세요."></textarea>
                <p class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
            </div>
            <div class="chip-row">
                <button type="button" class="filter-chip" data-suggest-for="#content">마당이 넓어요</button>
                <button type="button" class="filter-chip" data-suggest-for="#content">사진을 자주 보내주셨어요</button>
                <button type="button" class="filter-chip" data-suggest-for="#content">아이가 편하게 지냈어요</button>
                <button type="button" class="filter-chip" data-suggest-for="#content">친절하고 꼼꼼해요</button>
            </div>
        </div>

        <div class="sticky-footer">
            <button class="flow-cta is-block" type="submit">리뷰 등록하기</button>
        </div>
    </form>
</main>

<div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
