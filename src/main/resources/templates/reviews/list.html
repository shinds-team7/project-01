<!DOCTYPE html>
<!--/*
  리뷰 목록 = 프로토타입의 "REVIEWS" 화면.

  한 템플릿이 두 곳에서 쓰인다.
    GET /reviews/my            → 내가 쓴 리뷰. 모델에 placeId 가 없다.
    GET /reviews/place/{id}    → 장소별 리뷰. 모델에 placeId 가 있다.
  수정·삭제는 내 리뷰일 때만 의미가 있어 placeId 가 없을 때만 그린다.

  내 리뷰의 수정은 GET /reviews/{id}/edit, 삭제는 POST /reviews/{id}/delete 로 처리한다.
  삭제 버튼은 공용 modal.js 로 확인창을 연 뒤 모달 안의 폼을 제출한다.

  [reviews 원소가 쓰는 필드] ReviewResponse
    id · placeId · placeName · reviewerName · checkInAt · rating · content · replyContent

*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page(${placeId != null} ? '장소 리뷰' : '내 리뷰', 'my', ~{::main})}">
<body>
<main id="main-content" class="app-main">
    <style>
        .sort-tabs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-bottom:16px; padding:4px; border-radius:12px; background:#f3f4f6; }
        .sort-tabs a { padding:10px 6px; border-radius:9px; text-align:center; font-size:13px; font-weight:700; color:var(--muted); }
        .sort-tabs a.is-active { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.08); }
        .sort-tabs a:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
    </style>

    <div class="topbar">
        <a class="topbar-back" th:href="${placeId != null} ? @{/places/{id}(id=${placeId})} : @{/mypage}"
           aria-label="뒤로 가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1 th:text="${placeId != null} ? '장소 리뷰' : '리뷰 내역'">리뷰 내역</h1>
    </div>

    <div class="screen">
        <div class="notice notice-danger" role="alert" th:if="${deleteError}" th:text="${deleteError}"></div>

        <!--/*
          정렬 필터. 장소별 리뷰(placeId 있음)이면서 리뷰가 있을 때만 보여준다. /reviews/my 는 정렬 미지원.
          링크 세 개를 칸으로 끊어 버튼처럼 보이게 하고, 고른 칸에만 색이 들어간다.
        */-->
        <div class="sort-tabs" th:if="${placeId != null and !#lists.isEmpty(reviews)}" role="tablist" aria-label="리뷰 정렬">
            <a role="tab"
               th:href="@{/reviews/place/{id}(id=${placeId}, sort='LATEST')}"
               th:classappend="${currentSort == 'LATEST'} ? ' is-active'"
               th:aria-selected="${currentSort == 'LATEST'}">최신순</a>

            <a role="tab"
               th:href="@{/reviews/place/{id}(id=${placeId}, sort='RATING_DESC')}"
               th:classappend="${currentSort == 'RATING_DESC'} ? ' is-active'"
               th:aria-selected="${currentSort == 'RATING_DESC'}">별점 높은순</a>

            <a role="tab"
               th:href="@{/reviews/place/{id}(id=${placeId}, sort='RATING_ASC')}"
               th:classappend="${currentSort == 'RATING_ASC'} ? ' is-active'"
               th:aria-selected="${currentSort == 'RATING_ASC'}">별점 낮은순</a>
        </div>

        <div class="empty" th:if="${#lists.isEmpty(reviews)}">
            <span class="ico" aria-hidden="true">rate_review</span>
            <strong th:text="${placeId != null} ? '아직 등록된 리뷰가 없어요' : '아직 작성한 리뷰가 없어요'">아직 작성한 리뷰가 없어요</strong>
            <p>돌봄이 끝난 예약에 후기를 남겨보세요.</p>
            <a class="btn btn-primary" th:if="${placeId == null}" th:href="@{/reservation/list}">예약 내역 보러 가기</a>
        </div>

        <ul class="my-review-list" th:unless="${#lists.isEmpty(reviews)}">
            <li class="card-plain" th:each="review : ${reviews}">
                <div class="my-review-top">
                    <div class="media">
                        <span class="ico" aria-hidden="true">weekend</span>
                    </div>
                    <div class="my-review-head">
                        <a class="place-name" th:if="${placeId == null}"
                           th:href="@{/places/{id}(id=${review.placeId})}"
                           th:text="${review.placeName}">성수 조용한 단독주택 마당</a>
                        <span class="place-name" th:if="${placeId != null}"
                              th:text="${review.reviewerName != null ? review.reviewerName : '알 수 없음'}">작성자</span>

                        <small th:if="${review.checkInAt != null}"
                               th:text="${#temporals.format(review.checkInAt, 'yyyy년 M월 d일')} + ' 이용'">2026년 7월 18일 이용</small>

                        <!--/* 숫자 대신 별을 그린다. 못 채운 칸은 흐린 별로 남겨 몇 점인지 한눈에 보이게 한다. */-->
                        <p class="review-stars" th:aria-label="|별점 ${review.rating}점|">
                            <span class="ico is-filled" aria-hidden="true"
                                  th:each="star : ${#numbers.sequence(1, 5)}"
                                  th:classappend="${star > review.rating} ? ' is-off'">star</span>
                        </p>
                    </div>
                </div>

                <p class="my-review-body" th:text="${review.content}">
                    마당이 넓어서 우리 강아지가 정말 좋아했어요.
                </p>

                <div class="review-reply" th:if="${review.replyContent != null}">
                    <p class="review-reply-label">
                        <span class="ico" aria-hidden="true">store</span> 호스트 답글
                    </p>
                    <p class="review-reply-body" th:text="${review.replyContent}">답글 내용</p>
                </div>

                <!--/* 내 리뷰 목록에서만 수정·삭제를 보여준다. */-->
                <div class="card-actions" th:if="${placeId == null}">
                    <a th:href="@{/reviews/{id}/edit(id=${review.id})}">수정하기</a>
                    <button type="button" class="is-danger" data-modal-open
                            th:attr="aria-controls=|review-delete-${review.id}|">삭제하기</button>
                </div>

                <dialog class="modal" th:if="${placeId == null}"
                        th:id="|review-delete-${review.id}|"
                        th:attr="aria-labelledby=|review-delete-title-${review.id}|">
                    <form class="modal-inner" method="post"
                          th:action="@{/reviews/{id}/delete(id=${review.id})}">
                        <h2 th:id="|review-delete-title-${review.id}|">리뷰를 삭제할까요?</h2>
                        <p>삭제한 리뷰는 복구할 수 없어요.</p>
                        <div class="modal-actions">
                            <button class="btn btn-ghost" type="button" data-modal-close>취소</button>
                            <button class="btn btn-danger" type="submit">삭제하기</button>
                        </div>
                    </form>
                </dialog>
            </li>
        </ul>
    </div>

    <script th:src="@{/js/modal.js}"></script>
</main>
</body>
</html>
