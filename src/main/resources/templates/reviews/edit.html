<!DOCTYPE html>
<!--/*
  리뷰 수정 = "REVIEW WRITE" 화면의 수정 버전.

  ReviewUpdateRequest 는 rating · content 두 개뿐이라
  create.html 에서 reservationId hidden 과 사진 업로드 블록을 덜어냈다.
  상단 요약(장소명 / 이용 일정)은 컨트롤러가 placeName·checkInAt 를 넣어줄 때만 보인다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('리뷰 수정', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav has-cta">
    <div class="topbar">
        <a class="topbar-back" data-history-back th:href="@{/reviews/my}" aria-label="내 리뷰 목록으로 돌아가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>리뷰 수정</h1>
    </div>

    <form th:action="@{/reviews/{id}(id=${reviewId})}" th:object="${form}" method="post">
        <div class="screen">
            <div class="notice notice-danger" role="alert" th:if="${submitError}" th:text="${submitError}"></div>

            <div class="summary-row is-tinted" th:if="${placeName != null}">
                <div class="media">
                    <span class="ico" aria-hidden="true">weekend</span>
                </div>
                <div class="summary-copy">
                    <strong th:text="${placeName}">성수 조용한 단독주택 마당</strong>
                    <small th:if="${checkInAt != null}"
                           th:text="${#temporals.format(checkInAt, 'yyyy년 M월 d일')} + ' 이용'">2026년 7월 18일 이용</small>
                </div>
            </div>

            <p class="rating-ask">이용은 어떠셨나요?</p>
            <div class="star-picker" data-star-picker aria-label="별점 선택">
                <button type="button" aria-label="1점" aria-pressed="false"><span class="ico" aria-hidden="true">star</span></button>
                <button type="button" aria-label="2점" aria-pressed="false"><span class="ico" aria-hidden="true">star</span></button>
                <button type="button" aria-label="3점" aria-pressed="false"><span class="ico" aria-hidden="true">star</span></button>
                <button type="button" aria-label="4점" aria-pressed="false"><span class="ico" aria-hidden="true">star</span></button>
                <button type="button" aria-label="5점" aria-pressed="false"><span class="ico" aria-hidden="true">star</span></button>
            </div>
            <p class="rating-label" data-rating-label>별점을 선택해주세요</p>
            <input type="hidden" th:field="*{rating}" data-rating-input>
            <p class="field-error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"
               style="text-align:center"></p>

            <div class="field" style="margin-top:24px">
                <label class="field-label" for="content">
                    후기 내용 <span class="opt">최대 50자</span>
                </label>
                <textarea class="control" id="content" th:field="*{content}" th:errorclass="has-error"
                          rows="5" maxlength="50" data-count-target="[data-content-count]"
                          placeholder="다른 반려인들에게 도움이 되도록 솔직한 후기를 남겨주세요."></textarea>
                <p class="field-hint"><b data-content-count>0</b>/50</p>
                <p class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
            </div>

            <div class="suggest-row">
                <button type="button" class="chip" data-suggest-for="#content">마당이 넓어요</button>
                <button type="button" class="chip" data-suggest-for="#content">사진을 자주 보내주셨어요</button>
                <button type="button" class="chip" data-suggest-for="#content">아이가 편하게 지냈어요</button>
                <button type="button" class="chip" data-suggest-for="#content">친절하고 꼼꼼해요</button>
            </div>
        </div>

        <div class="cta-bar no-nav">
            <button class="btn btn-dark btn-block" type="submit">수정 완료</button>
        </div>
    </form>

    <div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>

    <script th:src="@{/js/app-flow.js}"></script>
</main>
</body>
</html>
