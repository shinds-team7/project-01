<!DOCTYPE html>
<!--
  검색·장소·찜 화면이 붙기 전까지 하단 네비의 목적지를 채워두는 임시 화면.
  해당 화면들이 만들어지면 이 템플릿과 HomeController 의 임시 매핑을 함께 지운다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page(${pageTitle}, ${navKey}, ~{::main})}">
<body>
<main id="main-content" class="app-main">
    <div class="screen-title" th:text="${pageTitle}">준비 중</div>
    <div class="screen">
        <div class="empty">
            <span class="ico" aria-hidden="true">construction</span>
            <strong>화면을 준비하고 있어요</strong>
            <p>곧 만나보실 수 있어요.</p>
        </div>
        <!--/* @{/} 는 /home 으로 리다이렉트되므로 곧바로 /home 을 가리킨다 */-->
        <a class="btn btn-primary btn-block" th:href="@{/home}">홈으로 돌아가기</a>
    </div>
</main>
</body>
</html>
