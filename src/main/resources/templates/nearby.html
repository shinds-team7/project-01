<!DOCTYPE html>
<!--/*
  내 주변 = 프로토타입의 "NEARBY" 화면 (지도 + 아래에서 올라오는 목록).

  GET /nearby 가 이 화면을 그린다. 하단 탭의 "내 주변"과 장소 목록의
  "지도 보기" 버튼이 여기로 온다.

  이식하면서 예전에 쓰던 place.distanceLabel · regionLabel · averageRating ·
  reviewCount · liked 처럼 서버에 없는 값을 걷어내고
  /places 가 쓰는 PlaceListResponse 에 맞췄다.

  거리순 정렬과 실제 지도는 아직 불가능하다.
    - place_addresses 테이블에 latitude·longitude 컬럼이 있지만
      엔티티·매퍼가 없어 자바 쪽에서 주소와 좌표를 읽지 못한다.
    - 지도 SDK 도 붙어 있지 않아 지도 자리는 도안으로 둔다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('내 주변', 'nearby', ~{::main})}">
<body>
<main id="main-content" class="app-main nearby-screen">
    <div class="media map-preview nearby-map" aria-hidden="true">
        <span class="map-pin"><span class="ico" aria-hidden="true">pets</span></span>
    </div>

    <div class="nearby-sheet">
        <div class="sheet-handle" aria-hidden="true"></div>

        <div class="nearby-sheet-head">
            <strong>내 주변 호스트</strong>
            <span class="result-count"
                  th:text="'총 ' + ${places == null ? 0 : #lists.size(places)} + '곳'">총 0곳</span>
        </div>

        <div class="notice" style="margin-top:12px">
            <span class="ico" aria-hidden="true">info</span>
            <span>주소·좌표가 아직 서버에 연결되지 않아 거리순 정렬과 지도 표시는 준비 중이에요.</span>
        </div>

        <div class="empty" th:if="${places == null or #lists.isEmpty(places)}">
            <span class="ico" aria-hidden="true">near_me</span>
            <strong>주변에 공개된 공간이 없어요</strong>
            <p>공개된 공간이 생기면 여기에서 바로 확인할 수 있어요.</p>
        </div>

        <div class="place-list" th:unless="${places == null or #lists.isEmpty(places)}">
            <a class="place-card" th:each="place : ${places}"
               th:href="@{/places/{id}(id=${place.id})}"
               th:aria-label="|${place.name} 상세보기|">
                <div class="media">
                    <span class="ico" aria-hidden="true">weekend</span>
                </div>
                <div class="place-card-body">
                    <p class="place-card-title" th:text="${place.name}">공간 이름</p>
                    <div class="place-tags">
                        <span class="is-type" th:if="${place.placeType != null}"
                              th:text="${place.placeType.label}">장소 유형</span>
                        <span class="is-size" th:if="${place.allowsSmallDog}">소형견</span>
                        <span class="is-size" th:if="${place.allowsMediumDog}">중형견</span>
                        <span class="is-size" th:if="${place.allowsLargeDog}">대형견</span>
                        <span class="is-extra" th:if="${place.providesYard}">마당</span>
                        <span class="is-extra" th:if="${place.providesWalk}">산책</span>
                    </div>
                    <p class="place-loc">
                        <span class="ico" aria-hidden="true">person</span>
                        <span th:text="${place.nickname}">호스트 닉네임</span>
                    </p>
                    <p class="place-price" th:if="${place.hourlyPrice != null}">
                        <span th:text="${#numbers.formatInteger(place.hourlyPrice, 0, 'COMMA')} + '원'">시간당 가격</span>
                        <small>/ 시간당</small>
                    </p>
                </div>
            </a>
        </div>
    </div>
</main>
</body>
</html>
