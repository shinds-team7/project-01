<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('내 정보', 'my', ~{::main})}">
<body>
<main id="main-content" class="app-main">
    <div class="topbar has-line">
        <a class="topbar-back" th:href="@{/mypage}" aria-label="마이페이지로 돌아가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>내 정보</h1>
    </div>

    <div class="screen">
        <div class="notice notice-green" role="status" th:if="${profileUpdated}">
            <span class="ico" aria-hidden="true">check_circle</span>
            <span>내 정보가 수정됐어요.</span>
        </div>

        <div class="notice notice-green" role="status" th:if="${passwordUpdated}">
            <span class="ico" aria-hidden="true">check_circle</span>
            <span>비밀번호가 변경됐어요.</span>
        </div>

        <section class="card card-raised my-account-profile" aria-labelledby="profile-title">
            <!--/* 프로필 이미지가 없으면 기존 이니셜 아바타를 폴백으로 쓴다. */-->
            <span class="my-account-avatar" aria-hidden="true">
                <img th:if="${profileImageUrl != null}" th:src="${profileImageUrl}" alt="">
                <th:block th:if="${profileImageUrl == null}"
                          th:text="${#strings.isEmpty(profile.nickname) ? '?' : #strings.substring(profile.nickname, 0, 1)}">보</th:block>
            </span>
            <div>
                <h2 id="profile-title" th:text="${profile.nickname}">보호자</h2>
                <p th:text="${profile.email}">guardian@petnow.kr</p>
            </div>
        </section>

        <div class="list">
            <div class="list-row">
                <span class="list-row-label">닉네임</span>
                <strong th:text="${profile.nickname}">보호자</strong>
            </div>
            <div class="list-row">
                <span class="list-row-label">이메일</span>
                <strong th:text="${profile.email}">guardian@petnow.kr</strong>
            </div>
            <div class="list-row">
                <span class="list-row-label">전화번호</span>
                <strong th:text="${profile.phone} ?: '미등록'">010-0000-0000</strong>
            </div>
        </div>

        <a class="btn btn-ghost btn-block" th:href="@{/my/profile/edit}" style="margin-top:14px">
            <span class="ico" aria-hidden="true">edit</span> 내 정보 수정
        </a>

        <a class="btn btn-ghost btn-block" th:href="@{/my/password}" style="margin-top:10px">
            <span class="ico" aria-hidden="true">lock</span> 비밀번호 변경
        </a>

        <div class="notice notice-green">
            <span class="ico" aria-hidden="true">verified_user</span>
            <p>연락처를 최신으로 유지하면 호스트가 예약 관련 안내를 더 빠르게 전달할 수 있어요.</p>
        </div>
    </div>
</main>
</body>
</html>
