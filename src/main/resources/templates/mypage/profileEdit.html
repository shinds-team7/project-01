<!DOCTYPE html>
<!--/* 내 정보 수정. 파일 input 은 ProfileEditRequest.image 에 name 으로 바인딩한다. */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('내 정보 수정', 'my', ~{::main})}">
<body>
<main id="main-content" class="app-main">
    <div class="topbar has-line">
        <a class="topbar-back" th:href="@{/my/profile}" aria-label="내 정보로 돌아가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>내 정보 수정</h1>
    </div>

    <!--/*
      파일을 보내려면 enctype 이 반드시 multipart/form-data 여야 한다.
      빠뜨리면 파일이 아니라 파일명 문자열만 넘어간다 (docs/CONVENTIONS.md §9.2).
    */-->
    <form th:action="@{/my/profile/edit}" method="post" enctype="multipart/form-data"
          th:object="${profileEditRequest}" novalidate>
        <div class="screen">
            <div class="notice notice-danger" role="alert" th:if="${#fields.hasErrors('global')}">
                <span class="ico" aria-hidden="true">error</span>
                <span th:each="err : ${#fields.errors('global')}" th:text="${err}">내 정보를 수정하지 못했습니다.</span>
            </div>

            <!--/*
              프로필 이미지 1장 (ImageCategory.USER 의 maxCount).

              data-* 기준값은 서버를 따라간다 (static/js/image-upload.js 주석 참고).
                data-max-files   ImageCategory.USER.maxCount = 1
                data-max-size-mb spring.servlet.multipart.max-file-size = 5MB
            */-->
            <div class="field">
                <label class="field-label" for="profile-image">프로필 이미지 <span class="opt">선택</span></label>

                <!--/*
                  현재 이미지. 공통 스크립트가 건드리는 것은 [data-image-upload] 안쪽뿐이므로
                  이 목록은 밖에 둔다. 안에 두면 초기 render() 가 지워 버린다.
                */-->
                <ul class="image-upload-list" th:if="${profileImageUrl != null}">
                    <li class="image-upload-item">
                        <img th:src="${profileImageUrl}" alt="현재 프로필 이미지">
                    </li>
                </ul>

                <div class="image-upload" data-image-upload data-max-files="1" data-max-size-mb="5">
                    <input class="image-upload-input" type="file" id="profile-image" name="image"
                           accept="image/jpeg,image/png,image/webp" data-image-upload-input>
                    <label class="image-upload-trigger" for="profile-image">
                        <span class="ico" aria-hidden="true">add_a_photo</span>
                        <b data-image-upload-label>사진 추가</b>
                        <small data-image-upload-guide></small>
                    </label>
                    <ul class="image-upload-list" data-image-upload-list></ul>
                    <p class="image-upload-error" role="alert" data-image-upload-error></p>
                </div>
                <p class="field-hint">고르지 않으면 지금 이미지를 그대로 둡니다.</p>
            </div>

            <div class="field">
                <label class="field-label" for="nickname">닉네임 <span class="req">필수</span></label>
                <div class="field-inline">
                    <input class="control" id="nickname" type="text" th:field="*{nickname}"
                           th:errorclass="has-error" maxlength="20" autocomplete="nickname"
                           aria-describedby="nickname-error nickname-check-result"
                           th:aria-invalid="${#fields.hasErrors('nickname')}" required>
                    <button class="btn btn-ghost" type="button" data-nickname-check>중복 확인</button>
                </div>
                <p class="field-error" id="nickname-error" th:errors="*{nickname}"></p>
                <p class="field-hint" id="nickname-check-result" data-nickname-check-result
                   role="status" aria-live="polite" hidden></p>
            </div>

            <div class="field">
                <label class="field-label" for="phone">전화번호</label>
                <input class="control" id="phone" type="tel" th:field="*{phone}" th:errorclass="has-error"
                       maxlength="20" autocomplete="tel" placeholder="010-0000-0000"
                       aria-describedby="phone-error" th:aria-invalid="${#fields.hasErrors('phone')}">
                <p class="field-error" id="phone-error" th:errors="*{phone}"></p>
            </div>

            <!--/* 이메일은 로그인 아이디라 여기서 바꾸지 않는다. 값만 보여준다. */-->
            <div class="field">
                <label class="field-label" for="email">이메일</label>
                <input class="control" id="email" type="email" th:value="${profile.email}" disabled>
                <p class="field-hint">이메일은 로그인에 쓰이는 값이라 바꿀 수 없어요.</p>
            </div>

            <div class="pet-editor-actions" style="margin-top:24px">
                <a class="btn btn-ghost" th:href="@{/my/profile}">취소</a>
                <button class="btn btn-primary" type="submit">저장하기</button>
            </div>
        </div>
    </form>

    <!--/*
      fragments/base 에는 화면별 스크립트 자리가 없다. <main> 끝에 두면 위 마크업이
      모두 파싱된 뒤 실행되므로 defer 없이도 안전하다 (auth/login.html 과 같은 방식).
      스타일시트는 base.html 이 이미 걸어 두었다.
    */-->
    <script th:src="@{/js/image-upload.js}"></script>
    <script th:src="@{/js/profile.js}"></script>
</main>
</body>
</html>
