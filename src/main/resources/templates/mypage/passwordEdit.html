<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('비밀번호 변경', 'my', ~{::main})}">
<body>
<main id="main-content" class="app-main">
    <div class="topbar has-line">
        <a class="topbar-back" th:href="@{/my/profile}" aria-label="내 정보로 돌아가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>비밀번호 변경</h1>
    </div>

    <form th:action="@{/my/password}" method="post" th:object="${passwordChangeRequest}" novalidate>
        <div class="screen">
            <div class="notice notice-danger" role="alert" th:if="${#fields.hasErrors('global')}">
                <span class="ico" aria-hidden="true">error</span>
                <span th:each="err : ${#fields.errors('global')}" th:text="${err}">비밀번호를 변경하지 못했습니다.</span>
            </div>

            <div class="field">
                <label class="field-label" for="current-password">현재 비밀번호</label>
                <div class="password-control">
                    <input class="control" id="current-password" type="password" th:field="*{currentPassword}"
                           th:errorclass="has-error" autocomplete="current-password" placeholder="현재 비밀번호를 입력해주세요"
                           aria-describedby="current-password-error"
                           th:aria-invalid="${#fields.hasErrors('currentPassword')}" data-password-input required>
                    <button class="password-toggle" type="button" data-password-toggle aria-pressed="false"
                            aria-controls="current-password" aria-label="비밀번호 표시">
                        <span class="ico" aria-hidden="true" data-password-icon>visibility</span>
                    </button>
                </div>
                <p class="field-error" id="current-password-error" th:errors="*{currentPassword}"></p>
            </div>

            <div class="field">
                <label class="field-label" for="new-password">새 비밀번호</label>
                <div class="password-control">
                    <input class="control" id="new-password" type="password" th:field="*{newPassword}"
                           th:errorclass="has-error" autocomplete="new-password" placeholder="새 비밀번호를 입력해주세요"
                           aria-describedby="new-password-error new-password-hint"
                           th:aria-invalid="${#fields.hasErrors('newPassword')}" data-password-input required>
                    <button class="password-toggle" type="button" data-password-toggle aria-pressed="false"
                            aria-controls="new-password" aria-label="비밀번호 표시">
                        <span class="ico" aria-hidden="true" data-password-icon>visibility</span>
                    </button>
                </div>
                <p class="field-error" id="new-password-error" th:errors="*{newPassword}"></p>
                <p class="field-hint" id="new-password-hint">영문과 숫자를 포함해 8자 이상 입력해주세요.</p>
            </div>

            <div class="field">
                <label class="field-label" for="new-password-confirm">새 비밀번호 확인</label>
                <div class="password-control">
                    <input class="control" id="new-password-confirm" type="password"
                           th:field="*{newPasswordConfirm}" th:errorclass="has-error" autocomplete="new-password"
                           placeholder="새 비밀번호를 다시 입력해주세요" aria-describedby="new-password-confirm-error"
                           th:aria-invalid="${#fields.hasErrors('newPasswordConfirm')}" data-password-input required>
                    <button class="password-toggle" type="button" data-password-toggle aria-pressed="false"
                            aria-controls="new-password-confirm" aria-label="비밀번호 표시">
                        <span class="ico" aria-hidden="true" data-password-icon>visibility</span>
                    </button>
                </div>
                <p class="field-error" id="new-password-confirm-error" th:errors="*{newPasswordConfirm}"></p>
            </div>

            <div class="pet-editor-actions" style="margin-top:24px">
                <a class="btn btn-ghost" th:href="@{/my/profile}">취소</a>
                <button class="btn btn-primary" type="submit">변경하기</button>
            </div>
        </div>
    </form>

    <script th:src="@{/js/auth.js}"></script>
</main>
</body>
</html>
