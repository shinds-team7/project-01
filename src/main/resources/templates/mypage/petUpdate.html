<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('반려동물 정보 수정', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav pet-editor-page">
    <div class="topbar has-line pet-editor-topbar">
        <a class="topbar-back" th:href="@{/mypage}" aria-label="마이페이지로 돌아가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>반려동물 정보 수정</h1>
    </div>

    <form class="pet-editor" th:action="@{/pet/update}" method="post">
        <input type="hidden" name="petId" th:value="${petId}">

        <section class="pet-editor-intro is-edit" aria-labelledby="pet-update-title">
            <span class="pet-editor-portrait" aria-hidden="true">
                <span class="ico is-filled">pets</span>
                <i class="ico">photo_camera</i>
            </span>
            <div>
                <span class="pet-editor-kicker">CARE PROFILE</span>
                <h2 id="pet-update-title"><span th:text="${pet.name}">초코</span>의<br>정보를 다듬어요</h2>
                <p>달라진 체중과 돌봄 메모를 최신 상태로 유지해 주세요.</p>
            </div>
        </section>

        <div class="pet-editor-fields">
            <div class="field pet-editor-name">
                <label for="update-name">이름 <span class="req">필수</span></label>
                <input class="control" id="update-name" name="name" type="text"
                       th:value="${pet.name}" maxlength="20" autocomplete="off" required>
            </div>

            <fieldset class="field pet-editor-fieldset">
                <legend class="field-label">크기 <span class="req">필수</span></legend>
                <div class="choice-row pet-size-choices">
                    <label class="choice">
                        <input type="radio" name="size" value="SMALL" required
                               th:checked="${pet.size != null and pet.size.name() == 'SMALL'}">
                        <span><i class="ico" aria-hidden="true">pets</i><b>소형</b><small>10kg 미만</small></span>
                    </label>
                    <label class="choice">
                        <input type="radio" name="size" value="MEDIUM"
                               th:checked="${pet.size != null and pet.size.name() == 'MEDIUM'}">
                        <span><i class="ico" aria-hidden="true">pets</i><b>중형</b><small>10–25kg</small></span>
                    </label>
                    <label class="choice">
                        <input type="radio" name="size" value="LARGE"
                               th:checked="${pet.size != null and pet.size.name() == 'LARGE'}">
                        <span><i class="ico" aria-hidden="true">pets</i><b>대형</b><small>25kg 이상</small></span>
                    </label>
                </div>
            </fieldset>

            <div class="pet-editor-split">
                <div class="field">
                    <label for="update-birth-year">태어난 해</label>
                    <select class="control" id="update-birth-year" name="birthYear">
                        <option value="">선택해 주세요</option>
                        <option th:each="year : ${#numbers.sequence(#dates.year(#dates.createNow()), 2000, -1)}"
                                th:value="${year}" th:text="${year} + '년'"
                                th:selected="${pet.birthYear == year}">2024년</option>
                    </select>
                </div>
                <div class="field">
                    <label for="update-weight">몸무게</label>
                    <span class="pet-unit-control">
                        <input class="control" id="update-weight" name="weight" type="number"
                               min="0.1" max="100" step="0.1" inputmode="decimal" th:value="${pet.weight}">
                        <span>kg</span>
                    </span>
                </div>
            </div>

            <fieldset class="field pet-editor-fieldset">
                <legend class="field-label">성별</legend>
                <div class="choice-row pet-sex-choices">
                    <label class="choice">
                        <input type="radio" name="sex" value="M" th:checked="${pet.sex == 'M'}"><span>남아</span>
                    </label>
                    <label class="choice">
                        <input type="radio" name="sex" value="F" th:checked="${pet.sex == 'F'}"><span>여아</span>
                    </label>
                </div>
            </fieldset>

            <input type="hidden" name="_isNeutered" value="on">
            <label class="pet-toggle">
                <input type="checkbox" name="isNeutered" value="true" th:checked="${pet.isNeutered}">
                <span><strong>중성화를 했어요</strong><small>호스트에게 미리 알려드려요</small></span>
                <i aria-hidden="true"></i>
            </label>

            <div class="field">
                <label for="update-memo">돌봄 메모 <span class="opt">선택</span></label>
                <textarea class="control pet-memo" id="update-memo" name="memo" rows="5" maxlength="500"
                          th:text="${pet.memo}" placeholder="좋아하는 것, 낯선 환경에서의 반응, 주의할 점을 알려주세요."></textarea>
                <p class="field-hint">예약할 때 호스트가 아이를 이해하는 데 도움이 돼요.</p>
            </div>

            <div class="pet-editor-actions">
                <a class="btn btn-ghost" th:href="@{/mypage}">취소</a>
                <button class="btn btn-primary" type="submit">변경사항 저장하기</button>
            </div>
            <a class="pet-danger-link" th:href="@{/pet/delete/{petId}(petId=${petId})}">
                <span class="ico" aria-hidden="true">delete</span> 이 반려동물 정보 삭제하기
            </a>
        </div>
    </form>
</main>
</body>
</html>
