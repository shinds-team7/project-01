<!DOCTYPE html>
<!--/*
  예약 내역 상세 = 프로토타입의 "BOOKING DETAIL" 화면.

  ⚠ 매핑 없는 화면. 실제로 열리는 예약 상세는 reservations/reservationDetail.html 이고
  GET /reservation/detail?reservationId=... 가 그걸 그린다.

  이식하면서 예전에 쓰던 booking.* (statusColor·whenLabel·petLine 처럼 어디에도 없는 값)을
  버리고, 실제로 내려오는 ReservationDetailResponse(=reservation) 에 맞췄다.
  프로토타입에만 있는 결제 정보 블록은 결제 도메인이 없어 옮기지 않았다.

  둘 중 하나로 정리하는 게 좋다.
    (a) GET /reservation/detail 이 이 템플릿을 그리게 하고 reservationDetail.html 을 지운다
    (b) 이 파일을 지우고 reservationDetail.html 에 취소 버튼만 옮긴다
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('예약 내역 상세', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav">
    <div class="topbar">
        <a class="topbar-back" th:href="@{/reservation/list}" aria-label="예약 목록으로 돌아가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>예약 내역 상세</h1>
    </div>

    <div class="screen">
        <div class="section-head">
            <h2 class="section-title" style="margin:0"
                th:text="${reservation.placeName}">성수 조용한 단독주택 마당</h2>
            <span class="badge"
                  th:classappend="${reservation.status?.name() == 'CONFIRMED' ? 'badge-green'
                                  : (reservation.status?.name() == 'CANCELED' ? 'badge-danger' : 'badge-warn')}"
                  th:text="${reservation.status?.name() == 'CONFIRMED' ? '예약 확정'
                           : (reservation.status?.name() == 'CANCELED' ? '취소됨' : '승인 대기')}">승인 대기</span>
        </div>

        <div class="media" style="height:150px">
            <span class="ico" aria-hidden="true">weekend</span>
        </div>

        <div class="block-gap"></div>

        <h2 class="section-title">일정</h2>
        <div class="info-rows">
            <div class="info-row">
                <span>맡기기</span>
                <span th:text="${reservation.checkIn != null
                                 ? #temporals.format(reservation.checkIn, 'yyyy.MM.dd (E) HH:mm')
                                 : '일정 미정'}">2026.08.02 (토) 13:00</span>
            </div>
            <div class="info-row">
                <span>데려오기</span>
                <span th:text="${reservation.checkOut != null
                                 ? #temporals.format(reservation.checkOut, 'yyyy.MM.dd (E) HH:mm')
                                 : '일정 미정'}">2026.08.02 (토) 18:00</span>
            </div>
        </div>

        <div class="block-gap"></div>

        <h2 class="section-title">반려견 정보</h2>

        <div class="empty" th:if="${#lists.isEmpty(reservation.pets)}">
            <span class="ico" aria-hidden="true">pets</span>
            <strong>등록된 동반 반려동물이 없어요</strong>
        </div>

        <div class="pet-picks" th:unless="${#lists.isEmpty(reservation.pets)}">
            <div class="person-row is-tinted" th:each="pet : ${reservation.pets}">
                <span class="avatar is-square"><span class="ico" aria-hidden="true">pets</span></span>
                <span class="person-copy">
                    <strong th:text="${pet.petName}">초코</strong>
                    <small>
                        <span th:text="${pet.size} ?: '크기 미입력'">소형</span>
                        <th:block th:if="${pet.weight != null}">
                            · <span th:text="${pet.weight} + 'kg'">6kg</span>
                        </th:block>
                    </small>
                </span>
            </div>
        </div>

        <div class="block-gap"></div>

        <h2 class="section-title">예약 정보</h2>
        <div class="info-rows">
            <div class="info-row">
                <span>예약번호</span>
                <span th:text="${reservation.reservationNo}">PN-20260802-0001</span>
            </div>
            <div class="info-row">
                <span>예약자 이름</span>
                <span th:text="${reservation.userName}">김하늘</span>
            </div>
        </div>

        <!--/* POST /reservation/cancel 은 ReservationCancelRequest(reservationId) 를 받는다 */-->
        <form th:action="@{/reservation/cancel}" method="post"
              th:if="${reservation.status?.name() != 'CANCELED'}">
            <input type="hidden" name="reservationId" th:value="${reservation.reservationId}">
            <button class="btn btn-danger btn-block" type="submit" style="margin-top:24px">예약 취소</button>
        </form>
    </div>
</main>
</body>
</html>
