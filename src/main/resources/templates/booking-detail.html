<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#22a45c">
    <title>예약 내역 상세 | Pet NOW</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../static/css/pet-now.css" th:href="@{/css/pet-now.css}">
    <link rel="stylesheet" href="../static/css/app-flow.css" th:href="@{/css/app-flow.css}">
    <script defer src="../static/js/app-flow.js" th:src="@{/js/app-flow.js}"></script>
</head>
<body class="flow-page">
<header class="site-header is-scrolled" data-header>
    <div class="header-inner">
        <a class="brand" href="/places" aria-label="Pet NOW 홈">
            <span class="brand-mark material-symbols-rounded" aria-hidden="true">pets</span>
            <span>Pet <b>NOW</b></span>
        </a>
        <div class="header-actions">
            <a class="profile-button" href="/mypage" aria-label="마이페이지">
                <span class="profile-avatar">지</span>
                <span class="profile-copy"><small>반가워요</small><strong>지우 보호자님</strong></span>
            </a>
        </div>
    </div>
</header>

<main class="flow-shell">
    <div class="flow-topbar">
        <a class="flow-back" href="/mypage#reservations" aria-label="뒤로 가기">
            <span class="material-symbols-rounded" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>예약 내역 상세</h1>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;">
        <strong style="font-size:20px;color:var(--ink-deep);font-weight:800;" th:text="${booking.status}">확정</strong>
        <span style="font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:8px;background:var(--pet-green-soft);"
              th:style="'color:' + ${booking.statusColor} + ';'" th:text="${booking.status}">확정</span>
    </div>

    <div class="media-placeholder" style="height:150px;border-radius:var(--radius-md);margin-top:16px;">
        <span class="material-symbols-rounded" aria-hidden="true">weekend</span>
    </div>
    <strong style="display:block;margin-top:16px;color:var(--ink-deep);font-size:17px;font-weight:800;" th:text="${booking.placeName}">초코의 포근한 오후</strong>
    <small style="display:block;margin-top:4px;color:var(--muted);font-size:12.5px;" th:text="${booking.region}">서울 마포구 연남동</small>

    <div style="display:flex;gap:10px;margin-top:16px;">
        <button type="button" class="link-action" data-pending-feature="주소 복사"
                style="flex:1;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:13.5px;font-weight:700;color:#374151;display:flex;align-items:center;justify-content:center;gap:6px;">
            <span class="material-symbols-rounded" aria-hidden="true" style="font-size:17px;">content_copy</span>주소 복사</button>
        <button type="button" class="link-action" data-pending-feature="호스트 문의"
                style="flex:1;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:13.5px;font-weight:700;color:#374151;display:flex;align-items:center;justify-content:center;gap:6px;">
            <span class="material-symbols-rounded" aria-hidden="true" style="font-size:17px;">chat_bubble</span>호스트 문의</button>
    </div>

    <div class="flow-divider"></div>

    <p class="flow-section-title">일정</p>
    <div style="display:flex;gap:14px;font-size:13.5px;">
        <span style="width:96px;flex:none;color:var(--muted);">이용 일시</span>
        <span style="color:var(--ink);font-weight:600;" th:text="${booking.whenLabel}">2026.08.08 (토) 14:00 ~ 20:00</span>
    </div>

    <div class="flow-divider"></div>

    <p class="flow-section-title">반려견 정보</p>
    <div class="pet-row">
        <span class="avatar"><span class="material-symbols-rounded" aria-hidden="true">pets</span></span>
        <span class="who"><strong>반려견 정보</strong><small th:text="${booking.petLine}">초코 · 토이 푸들 · 4.2kg</small></span>
    </div>

    <div class="flow-divider"></div>

    <p class="flow-section-title">예약 정보</p>
    <div style="display:flex;gap:14px;font-size:13.5px;align-items:center;">
        <span style="width:96px;flex:none;color:var(--muted);">예약번호</span>
        <span style="color:var(--ink);font-weight:600;" th:text="${booking.reservationCode}">PN-20260808-0001</span>
        <button type="button" class="link-action" data-pending-feature="예약번호 복사" style="color:var(--pet-green-dark);font-weight:700;">복사</button>
    </div>

    <div class="flow-divider"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;">
        <p class="flow-section-title" style="margin:0;">결제 정보</p>
        <button type="button" class="link-action" data-pending-feature="결제 증빙"
                style="font-size:12px;font-weight:700;color:#374151;border:1px solid var(--line);border-radius:8px;padding:6px 10px;">결제 증빙 보기</button>
    </div>
    <div class="price-breakdown" style="border-top:0;margin-top:14px;">
        <div class="row"><span>결제 일시</span><span th:text="${booking.paidAt}">2026.08.07 (금) 21:04</span></div>
        <div class="row"><span>결제 수단</span><span th:text="${booking.payMethod}">토스페이</span></div>
        <div class="row"><span>이용 요금</span><span th:text="${#numbers.formatInteger(booking.usageFee, 0, 'COMMA')} + '원'">60,000원</span></div>
        <div class="row"><span>서비스 수수료</span><span th:text="${#numbers.formatInteger(booking.serviceFee, 0, 'COMMA')} + '원'">3,000원</span></div>
    </div>
    <div class="price-total">
        <strong>실 결제 금액</strong>
        <strong style="color:var(--danger);" th:text="${#numbers.formatInteger(booking.usageFee + booking.serviceFee, 0, 'COMMA')} + '원'">63,000원</strong>
    </div>

    <button type="button" class="flow-cta is-block" data-pending-feature="예약 취소" th:if="${booking.cancellable}"
            style="margin-top:24px;background:#fdeced;color:var(--danger);border:1px solid #f2c3c4;">예약 취소</button>
    <a class="flow-cta is-block" th:unless="${booking.cancellable}" th:href="@{/reviews/new(reservationId=${booking.id}, placeName=${booking.placeName})}"
       style="margin-top:24px;">리뷰 쓰기</a>
</main>

<div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
