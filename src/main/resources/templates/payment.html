<!DOCTYPE html>
<!--/*
  결제 = 프로토타입의 "PAYMENT" 화면.

  ⚠ 이 화면에는 컨트롤러 매핑이 없다. 결제 도메인(PG 연동·결제 엔티티)이 아직 없어서
  예약 플로우는 예약 요청 → POST /reservation/create → /reservation/success 로 곧장 간다.
  프로토타입의 결제 단계를 살릴 때 쓰라고 마크업만 앱 셸로 옮겨 뒀다.

  살리려면 필요한 것
    - GET  /reservation/payment?reservationId=... 매핑과 place·금액 모델
    - POST 결제 승인 엔드포인트
  모델이 없어도 깨지지 않도록 place 참조는 모두 안전 참조(?.)로 두었다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('결제', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav has-cta">
    <div class="topbar">
        <a class="topbar-back" data-history-back th:href="${place != null} ? @{/places/{id}(id=${place.id})} : @{/places}"
           aria-label="뒤로 가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>결제</h1>
    </div>

    <div class="screen">
        <div class="notice">
            <span class="ico" aria-hidden="true">info</span>
            <span>결제 연동 전 디자인 화면이에요. 실제 결제는 아직 동작하지 않습니다.</span>
        </div>

        <div class="summary-row is-boxed">
            <div class="media">
                <span class="ico" aria-hidden="true">image</span>
            </div>
            <div class="summary-copy">
                <strong th:text="${place?.name} ?: '성수 조용한 단독주택 마당'">성수 조용한 단독주택 마당</strong>
                <small th:text="${stayInfo} ?: '이용 일정과 반려견 정보가 들어갑니다'">이용 일정과 반려견 정보가 들어갑니다</small>
            </div>
        </div>

        <h2 class="section-title">결제 수단</h2>
        <div class="pay-methods">
            <label class="pay-method">
                <input type="radio" name="payMethod" value="toss" data-cta-label="토스로" checked>
                <span>
                    <span class="method-mark">t</span>
                    <span class="method-name">토스페이 간편결제</span>
                    <span class="ico method-check" aria-hidden="true">check_circle</span>
                </span>
            </label>
            <label class="pay-method">
                <input type="radio" name="payMethod" value="card" data-cta-label="카드로">
                <span>
                    <span class="method-mark is-card"><span class="ico" aria-hidden="true">credit_card</span></span>
                    <span class="method-name">신용·체크카드</span>
                    <span class="ico method-check" aria-hidden="true">check_circle</span>
                </span>
            </label>
        </div>

        <h2 class="section-title">결제 금액</h2>
        <div class="info-rows">
            <div class="info-row is-split">
                <span>이용 요금</span>
                <span th:text="${usageFee != null} ? ${#numbers.formatInteger(usageFee, 0, 'COMMA')} + '원' : '-'">-</span>
            </div>
            <div class="info-row is-split">
                <span>서비스 수수료</span>
                <span th:text="${serviceFee != null} ? ${#numbers.formatInteger(serviceFee, 0, 'COMMA')} + '원' : '-'">-</span>
            </div>
        </div>
        <div class="info-total">
            <span>총 결제금액</span>
            <span class="amount"
                  th:text="${totalPrice != null} ? ${#numbers.formatInteger(totalPrice, 0, 'COMMA')} + '원' : '-'">-</span>
        </div>
    </div>

    <div class="cta-bar no-nav">
        <button class="btn btn-toss btn-block" type="button" disabled>결제하기</button>
    </div>
</main>
</body>
</html>
