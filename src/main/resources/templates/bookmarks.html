<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('찜한 호스트', 'like', ~{::main})}">
<body>
<main id="main-content" class="app-main">
    <div class="screen">
        <div class="topbar has-line">
            <a class="topbar-back" th:href="@{/home}" aria-label="홈으로 돌아가기">
                <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
            </a>
            <h1>찜한 호스트</h1>
        </div>

        <div class="notice notice-green" role="status" data-bookmark-status hidden>
            <span class="ico" aria-hidden="true">check_circle</span>
            <span data-bookmark-status-text>찜 상태가 변경됐어요.</span>
        </div>

        <div class="place-list bookmark-list" th:unless="${#lists.isEmpty(places)}">
            <article class="place-card bookmark-card" th:each="place : ${places}" data-bookmark-card>
                <a class="bookmark-card-link"
                   th:href="@{/places/{id}(id=${place.id})}"
                   th:aria-label="|${place.name} 상세보기|">
                    <div class="media">
                        <img th:if="${place.thumbnailUrl != null}" th:src="${place.thumbnailUrl}"
                             th:alt="${place.name}">
                        <span th:unless="${place.thumbnailUrl != null}" class="ico" aria-hidden="true">weekend</span>
                    </div>
                    <div class="place-card-body">
                        <p class="place-card-title" th:text="${place.name}">공간 이름</p>
                        <div class="place-tags">
                            <span class="is-type" th:if="${place.placeType != null}"
                                  th:text="${place.placeType.label}">장소 유형</span>
                            <span class="is-size" th:if="${place.allowsSmallDog}">소형견</span>
                            <span class="is-size" th:if="${place.allowsMediumDog}">중형견</span>
                            <span class="is-size" th:if="${place.allowsLargeDog}">대형견</span>
                            <span class="is-extra" th:if="${place.providesYard}">마당</span>
                            <span class="is-extra" th:if="${place.providesWalk}">산책</span>
                        </div>
                        <p class="place-loc">
                            <span class="ico" aria-hidden="true">person</span>
                            <span th:text="${place.nickname}">호스트 닉네임</span>
                        </p>
                        <p class="place-price" th:if="${place.hourlyPrice != null}">
                            <span th:text="${#numbers.formatInteger(place.hourlyPrice, 0, 'COMMA')} + '원'">12,000원</span>
                            <small>/ 시간</small>
                        </p>
                        <p class="place-price" th:if="${place.hourlyPrice == null}">가격 문의</p>
                    </div>
                </a>
                <button class="like-btn is-on"
                        type="button"
                        th:data-place-id="${place.id}"
                        aria-label="찜 취소"
                        aria-pressed="true"
                        data-bookmark-toggle
                        data-remove-card-on-unbookmark>
                    <span class="ico" aria-hidden="true">favorite</span>
                </button>
            </article>
        </div>

        <div class="empty" th:hidden="${!#lists.isEmpty(places)}" data-bookmark-empty>
            <span class="ico" aria-hidden="true">favorite</span>
            <strong>아직 찜한 호스트가 없어요</strong>
            <p>마음에 드는 공간을 찜하면 여기에서 다시 볼 수 있어요.</p>
            <a class="btn btn-primary" th:href="@{/places}">공간 둘러보기</a>
        </div>
    </div>
    <script th:src="@{/js/bookmark.js}"></script>
</main>
</body>
</html>
