<!DOCTYPE html>
<!--
  앱 공용 레이아웃.

  사용법 — 화면 템플릿의 <html> 에 아래처럼 선언하면 문서 전체가 이 파일로 대체되고,
  세 번째 인자로 넘긴 <main> 이 본문 자리에 들어간다.

    <html th:replace="~{fragments/base :: page('홈', 'home', ~{::main})}">
    <body>
    <main class="app-main">...</main>
    </body>
    </html>

  nav 인자는 하단 탭(데스크톱에선 좌측 사이드 네비)에서 활성화할 항목의 키다.
  'home' | 'search' | 'nearby' | 'like' | 'my' 중 하나를 쓰고,
  네비를 감출 화면(상세·예약 플로우 등)에서는 'none' 을 넘긴다.

  주의 — 넘긴 <main> 이 아래 <main id="main-content"> 를 통째로 교체하므로,
  화면 쪽 <main> 에 id="main-content" 를 직접 달아야 한다. 빠지면 첫 요소인
  "본문으로 바로가기" 스킵 링크가 목적지를 잃는다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, nav, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#22a45c">
    <title th:text="${title} + ' | Pet NOW'">Pet NOW</title>
    <meta name="description" content="믿을 수 있는 우리 동네 펫시터, Pet NOW">
    <link rel="canonical" th:href="${openGraphUrl}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:site_name" content="Pet NOW">
    <meta property="og:title" content="Pet NOW" th:content="${title} + ' | Pet NOW'">
    <meta property="og:description" content="믿을 수 있는 우리 동네 펫시터, Pet NOW">
    <meta property="og:url" th:content="${openGraphUrl}">
    <meta property="og:image" th:content="${openGraphImageUrl}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1536">
    <meta property="og:image:height" content="1024">
    <meta property="og:image:alt" content="Pet NOW 초록색 발바닥 로고">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pet NOW" th:content="${title} + ' | Pet NOW'">
    <meta name="twitter:description" content="믿을 수 있는 우리 동네 펫시터, Pet NOW">
    <meta name="twitter:image" th:content="${openGraphImageUrl}">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/image-upload.css}">
</head>
<body>
<a class="skip-link" href="#main-content">본문으로 바로가기</a>

<div class="app">
    <th:block th:if="${nav != 'none'}">
        <nav th:replace="~{fragments/components :: nav(${nav})}"></nav>
    </th:block>
    <main id="main-content" class="app-main" th:replace="${content}"></main>
</div>
<script defer th:src="@{/js/form-guard.js}"></script>
<script defer th:src="@{/js/home.js}"></script>
<script defer th:if="${title == '홈'}" th:src="@{/js/home-classic.js}"></script>

</body>
</html>
