<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#22a45c">
    <title>예약 요청 | Pet NOW</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../static/css/pet-now.css" th:href="@{/css/pet-now.css}">
    <link rel="stylesheet" href="../static/css/host-place.css" th:href="@{/css/host-place.css}">
    <link rel="stylesheet" href="../static/css/app-flow.css" th:href="@{/css/app-flow.css}">
    <script defer src="../static/js/app-flow.js" th:src="@{/js/app-flow.js}"></script>
</head>
<body class="flow-page">
<a class="skip-link" href="#main-content">본문으로 바로가기</a>

<header class="site-header is-scrolled" data-header>
    <div class="header-inner">
        <a class="brand" href="/places" aria-label="Pet NOW 홈">
            <span class="brand-mark material-symbols-rounded" aria-hidden="true">pets</span>
            <span>Pet <b>NOW</b></span>
        </a>
        <div class="header-actions">
            <a class="profile-button" href="/mypage" aria-label="마이페이지">
                <span class="profile-avatar">지</span>
                <span class="profile-copy"><small>반가워요</small><strong>지우 보호자님</strong></span>
            </a>
        </div>
    </div>
</header>

<main id="main-content" class="flow-shell">
    <div class="flow-topbar">
        <a class="flow-back" th:href="@{/places/{id}(id=${place.id})}" aria-label="뒤로 가기">
            <span class="material-symbols-rounded" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>예약 요청</h1>
    </div>

    <div class="summary-card">
        <div class="media-placeholder"><span class="material-symbols-rounded" aria-hidden="true">weekend</span></div>
        <div class="summary-body">
            <span class="summary-tag" th:text="${place.placeType.label + ' · ' + place.areaSize + '평'}">단독주택 · 42평</span>
            <strong th:text="${place.name}">성수 조용한 단독주택 마당</strong>
            <small th:text="${place.hostUserNickname}">김도윤 안심 가디언</small>
        </div>
    </div>

    <div class="flow-section">
        <div class="schedule-split">
            <div>
                <small>인계일 (체크인)</small>
                <strong>8월 9일</strong>
                <span>시간 13:00</span>
            </div>
            <div>
                <small>귀가일 (체크아웃)</small>
                <strong>8월 9일</strong>
                <span>시간 18:00</span>
            </div>
        </div>
    </div>

    <div class="flow-section">
        <p class="flow-section-title">반려견 프로필<button type="button" class="link-action" data-pending-feature="반려견 변경">변경하기</button></p>
        <div class="pet-row">
            <span class="avatar"><span class="material-symbols-rounded" aria-hidden="true">pets</span></span>
            <span class="who">
                <strong>초코</strong>
                <small>푸들 · 6kg · 소형</small>
            </span>
            <span class="material-symbols-rounded is-check" aria-hidden="true">check_circle</span>
        </div>
    </div>

    <div class="flow-section">
        <p class="flow-section-title">호스트에게 요청 메시지</p>
        <textarea class="control" rows="4" placeholder="분리불안이 조금 있어요. 자주 확인 부탁드립니다 🐾"></textarea>
    </div>
</main>

<div class="sticky-footer">
    <div class="footer-price">
        <strong><span th:text="${#numbers.formatInteger(place.hourlyPrice * 5 + 3000, 0, 'COMMA')}">63,000</span>원</strong>
        <small>5시간 · 시간당 <span th:text="${#numbers.formatInteger(place.hourlyPrice, 0, 'COMMA')}">12,000</span>원</small>
    </div>
    <a class="flow-cta" th:href="@{/places/{id}/payment(id=${place.id})}">결제하기</a>
</div>

<div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
