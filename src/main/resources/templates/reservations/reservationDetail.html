<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('예약 상세', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav has-cta">
    <style>
        .reservation-cta .btn { flex:1; min-width:0; padding-inline:12px; }
        .reservation-cta .btn-danger { flex:.75; }
    </style>

    <div class="topbar has-line">
        <a class="topbar-back" th:href="@{/reservation/list}" aria-label="예약 목록으로 돌아가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>예약 상세</h1>
    </div>

    <div class="screen">
        <section class="card card-raised" aria-labelledby="reservation-summary">
            <div class="section-head">
                <h2 class="section-title" id="reservation-summary"
                    th:text="${reservation.placeName}">연남동 윤슬 호스트</h2>
                <span class="badge"
                      th:classappend="${reservation.status?.name() == 'CONFIRMED' ? 'badge-green'
                                      : (reservation.status?.name() == 'CANCELED' ? 'badge-danger' : 'badge-warn')}"
                      th:text="${reservation.status?.name() == 'CONFIRMED' ? '예약 확정'
                               : (reservation.status?.name() == 'CANCELED' ? '취소됨' : '응답 대기')}">응답 대기</span>
            </div>

            <div class="list">
                <div class="list-row">
                    <span class="list-row-label">예약 번호</span>
                    <strong th:text="${reservation.reservationNo}">PN-00000000-0000</strong>
                </div>
                <div class="list-row">
                    <span class="list-row-label">예약자</span>
                    <strong th:text="${reservation.userName}">홍길동</strong>
                </div>
                <div class="list-row">
                    <span class="list-row-label">맡기기</span>
                    <strong th:text="${reservation.checkIn != null
                                      ? #temporals.format(reservation.checkIn, 'yyyy년 M월 d일 HH:mm')
                                      : '일정 미정'}">2026년 8월 5일 12:00</strong>
                </div>
                <div class="list-row">
                    <span class="list-row-label">데려오기</span>
                    <strong th:text="${reservation.checkOut != null
                                      ? #temporals.format(reservation.checkOut, 'yyyy년 M월 d일 HH:mm')
                                      : '일정 미정'}">2026년 8월 6일 12:00</strong>
                </div>
            </div>
        </section>

        <h2 class="section-title">동반 반려동물</h2>

        <div class="empty" th:if="${#lists.isEmpty(reservation.pets)}">
            <span class="ico" aria-hidden="true">pets</span>
            <strong>등록된 동반 반려동물이 없어요</strong>
        </div>

        <div class="list" th:unless="${#lists.isEmpty(reservation.pets)}">
            <div class="card list-row" th:each="pet : ${reservation.pets}">
                <span class="media media-sm media-warm" aria-hidden="true">
                    <span class="ico is-filled">pets</span>
                </span>
                <span class="list-row-label">
                    <strong th:text="${pet.petName}">초코</strong>
                    <small>
                        <span th:text="${pet.size} ?: '크기 미입력'">소형</span>
                        <th:block th:if="${pet.weight != null}">
                            · <span th:text="${pet.weight} + 'kg'">4.5kg</span>
                        </th:block>
                    </small>
                </span>
            </div>
        </div>
    </div>

    <!--/*
      리뷰 진입점. 마이페이지 → 예약 상세가 리뷰 작성으로 들어가는 유일한 통로다.
      이미 리뷰를 쓴 예약이면 작성 폼 대신 수정 화면으로 보낸다. 작성 폼으로 다시 보내면
      등록 단계에서 REVIEW_DUPLICATE 로 튕겨 무엇이 잘못됐는지 화면에서 알 수 없다.
      취소된 예약은 남길 후기가 없으므로 CTA 자체를 그리지 않는다.
    */-->
    <div class="cta-bar no-nav reservation-cta" th:unless="${reservation.status?.name() == 'CANCELED'}">
        <button class="btn btn-danger" type="button" data-modal-open
                aria-controls="reservation-cancel-modal">예약 취소</button>
        <a class="btn btn-dark btn-block" th:if="${myReviewId == null}"
           th:href="@{/reviews/new(reservationId=${reservation.reservationId})}">리뷰 쓰기</a>
        <a class="btn btn-ghost btn-block" th:if="${myReviewId != null}"
           th:href="@{/reviews/{reviewId}/edit(reviewId=${myReviewId})}">리뷰 수정하기</a>
    </div>

    <dialog class="modal" id="reservation-cancel-modal"
            aria-labelledby="reservation-cancel-title"
            th:unless="${reservation.status?.name() == 'CANCELED'}">
        <form class="modal-inner" th:action="@{/reservation/cancel}" method="post">
            <input type="hidden" name="reservationId" th:value="${reservation.reservationId}">
            <h2 id="reservation-cancel-title">예약을 취소할까요?</h2>
            <p>
                예약 번호 <strong th:text="${reservation.reservationNo}">PN-00000000-0000</strong><br>
                취소하면 예약 시간이 다시 열려요.
            </p>
            <div class="modal-actions">
                <button class="btn btn-ghost" type="button" data-modal-close>계속 이용</button>
                <button class="btn btn-danger" type="submit">예약 취소</button>
            </div>
        </form>
    </dialog>

    <script th:src="@{/js/modal.js}"></script>
</main>
</body>
</html>
