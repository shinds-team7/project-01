<!DOCTYPE html>
<!--/*
  예약 요청 = 프로토타입의 "BOOKING REQUEST" 화면.

  이식 전에는 폼이 없고 하단 버튼이 매핑 없는 /places/{id}/payment 를 가리켜
  404 로 끝났다. 지금은 실제로 있는 POST /reservation/create 로 보낸다.
  (프로토타입의 결제 화면은 서버가 없어 건너뛴다 — payment.html 주석 참고)

  ReservationRequest 가 요구하는 값
    placeId  hidden
    petIds   ${pets} 체크박스. 로그인 사용자의 반려동물 목록이다 (#187).
    checkIn / checkOut  datetime-local (ISO_LOCAL_DATE_TIME 으로 그대로 바인딩된다)
    memo     선택

  검증 실패로 되돌아올 때 컨트롤러가 place 와 pets 를 다시 담아주므로 화면은 그대로 그려진다.
  이때만 모델에 reservationRequest 가 있어 필드 에러를 띄울 수 있다.

  비로그인 사용자는 이 화면에 들어오지 못한다. 컨트롤러가 GET 시점에 redirect:/ 로 보낸다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('예약 요청', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav has-cta">
    <div class="topbar">
        <a class="topbar-back" th:href="@{/places/{id}(id=${place.id})}" aria-label="뒤로 가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>예약 요청</h1>
    </div>

    <form th:action="@{/reservation/create}" method="post">
        <input type="hidden" name="placeId" th:value="${place.id}">

        <div class="screen">
            <div th:if="${reservationRequest != null}" th:object="${reservationRequest}">
                <div class="notice notice-danger" role="alert" th:if="${#fields.hasAnyErrors()}">
                    <span class="ico" aria-hidden="true">error</span>
                    <span th:each="err : ${#fields.allErrors()}" th:text="${err}">입력값을 확인해주세요.</span>
                </div>
            </div>

            <div class="summary-row">
                <div class="media">
                    <span class="ico" aria-hidden="true">weekend</span>
                </div>
                <div class="summary-copy">
                    <span class="badge badge-warn" th:if="${place.placeType != null}"
                          th:text="${place.placeType.label}">단독주택</span>
                    <strong th:text="${place.name}">성수 조용한 단독주택 마당</strong>
                    <small th:text="${place.hostUserNickname}">김도윤 호스트</small>
                </div>
            </div>

            <!--/*
              datetime-local 은 step 기본값이 60초라 초가 붙은 값은 stepMismatch 로 막힌다.
              LocalDateTime 의 기본 문자열은 초가 0이 아니면 초까지 내므로 분까지만 포맷한다.
            */-->
            <div class="schedule-split">
                <div>
                    <label for="checkIn"><small>인계일 (체크인)</small></label>
                    <input class="control" id="checkIn" name="checkIn" type="datetime-local" required
                           th:value="${reservationRequest?.checkIn != null}
                                     ? ${#temporals.format(reservationRequest.checkIn, 'yyyy-MM-dd''T''HH:mm')} : null">
                </div>
                <div>
                    <label for="checkOut"><small>귀가일 (체크아웃)</small></label>
                    <input class="control" id="checkOut" name="checkOut" type="datetime-local" required
                           th:value="${reservationRequest?.checkOut != null}
                                     ? ${#temporals.format(reservationRequest.checkOut, 'yyyy-MM-dd''T''HH:mm')} : null">
                </div>
            </div>

            <div class="section-head">
                <h2 class="section-title">반려견 프로필</h2>
                <a class="section-more" th:href="@{/mypage}">변경하기</a>
            </div>

            <div class="pet-picks" th:if="${pets != null and !#lists.isEmpty(pets)}">
                <label class="pet-pick" th:each="pet : ${pets}">
                    <input type="checkbox" name="petIds" th:value="${pet.id}">
                    <span class="person-row">
                        <span class="avatar"><span class="ico" aria-hidden="true">pets</span></span>
                        <span class="person-copy">
                            <strong th:text="${pet.name}">초코</strong>
                            <small th:text="${pet.size != null ? pet.size.label : ''} + (${pet.weight != null} ? ' · ' + ${pet.weight} + 'kg' : '')">소형 · 6kg</small>
                        </span>
                        <span class="ico is-check" aria-hidden="true">check_circle</span>
                    </span>
                </label>
            </div>

            <!--/*
              등록한 반려동물이 한 마리도 없으면 이 안내가 대신 나온다.
              petIds 는 @NotEmpty 라 선택 없이 보내면 검증에서 막힌다.
            */-->
            <div class="notice" th:unless="${pets != null and !#lists.isEmpty(pets)}">
                <span class="ico" aria-hidden="true">pets</span>
                <span>맡길 반려동물을 먼저 등록해주세요. <a th:href="@{/pet/new}">반려동물 등록하기</a></span>
            </div>

            <h2 class="section-title">호스트에게 요청 메시지</h2>
            <textarea class="control" name="memo" rows="4"
                      placeholder="분리불안이 조금 있어요. 자주 확인 부탁드립니다 🐾"
                      th:text="${reservationRequest?.memo}"></textarea>
        </div>

        <div class="cta-bar no-nav">
            <div class="cta-copy">
                <p class="cta-price" th:if="${place.hourlyPrice != null}"
                   th:text="${#numbers.formatInteger(place.hourlyPrice, 0, 'COMMA')} + '원'">12,000원</p>
                <p class="cta-price" th:if="${place.hourlyPrice == null}">가격 문의</p>
                <small class="cta-note">시간당 요금 · 총액은 이용 시간에 따라 정해져요</small>
            </div>
            <button class="btn btn-dark" type="submit">예약 요청하기</button>
        </div>
    </form>
</main>
</body>
</html>
