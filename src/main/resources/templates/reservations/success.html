<!DOCTYPE html>
<!--/*
  예약 완료 = 프로토타입의 "SUCCESS" 화면.

  컨트롤러가 flash 로 넘겨주는 값은 reservationNo 하나뿐이라
  프로토타입의 "예약 상세 보기"는 예약 목록으로 연결했다.
  (상세는 reservationId 가 있어야 하는데 지금은 내려오지 않는다)
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('예약 완료', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav success-screen">
    <span class="success-mark"><span class="ico" aria-hidden="true">check</span></span>

    <h1>예약 요청이 완료되었어요</h1>
    <p>호스트 승인 후 예약이 확정됩니다.<br>결과는 예약 내역에서 확인할 수 있어요.</p>

    <div class="success-summary">
        <strong>예약번호</strong>
        <small th:text="${reservationNo} ?: '발급 예정'">PN-20260808-1A2B3C4D</small>
    </div>

    <div class="success-actions">
        <a class="btn btn-dark btn-block" th:href="@{/reservation/list}">예약 내역 보기</a>
        <a class="btn btn-ghost btn-block" th:href="@{/home}">홈으로 돌아가기</a>
    </div>
</main>
</body>
</html>
