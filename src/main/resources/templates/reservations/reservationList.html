<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('예약 목록', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav">
    <div class="topbar has-line">
        <a class="topbar-back" th:href="@{/mypage}" aria-label="마이페이지로 돌아가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>예약 목록</h1>
    </div>

    <div class="screen">
        <div class="empty" th:if="${#lists.isEmpty(reservations)}">
            <span class="ico" aria-hidden="true">event_busy</span>
            <strong>조회된 예약 내역이 없어요</strong>
            <p>마음에 드는 돌봄 공간을 찾아 첫 예약을 남겨보세요.</p>
            <a class="btn btn-primary" th:href="@{/places}">돌봄 공간 둘러보기</a>
        </div>

        <div class="list" th:unless="${#lists.isEmpty(reservations)}">
            <a class="card list-row reservation-row"
               th:each="reservation : ${reservations}"
               th:href="@{/reservation/detail(reservationId=${reservation.reservationId})}">
                <span class="reservation-row-copy">
                    <strong th:text="${reservation.placeName}">연남동 윤슬 호스트</strong>
                    <small>
                        <span th:text="${reservation.checkIn != null
                                         ? #temporals.format(reservation.checkIn, 'M월 d일 HH:mm')
                                         : '일정 미정'}">8월 5일 12:00</span>
                        <th:block th:if="${reservation.checkIn != null and reservation.checkOut != null}">
                            —
                            <!--/* 같은 날이면 끝나는 시각만, 날을 넘기면 날짜까지 보여준다 */-->
                            <span th:text="${#temporals.format(reservation.checkIn, 'yyyy-MM-dd')
                                              == #temporals.format(reservation.checkOut, 'yyyy-MM-dd')
                                             ? #temporals.format(reservation.checkOut, 'HH:mm')
                                             : #temporals.format(reservation.checkOut, 'M월 d일 HH:mm')}">20:00</span>
                        </th:block>
                    </small>
                    <small th:if="${reservation.totalPrice != null}"
                           th:text="${#numbers.formatInteger(reservation.totalPrice, 0, 'COMMA')} + '원'">48,000원</small>
                </span>

                <span class="badge"
                      th:classappend="${reservation.reservationStatus?.name() == 'CONFIRMED' ? 'badge-green'
                                      : (reservation.reservationStatus?.name() == 'CANCELED' ? 'badge-danger' : 'badge-warn')}"
                      th:text="${reservation.reservationStatus?.name() == 'CONFIRMED' ? '예약 확정'
                               : (reservation.reservationStatus?.name() == 'CANCELED' ? '취소됨' : '응답 대기')}">응답 대기</span>
            </a>
        </div>
    </div>
</main>
</body>
</html>
