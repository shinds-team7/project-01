<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('예약 목록', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav">
    <style>
        .reservation-filter-tabs { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; margin-bottom:16px; padding:4px; border-radius:12px; background:#f3f4f6; }
        .reservation-filter-tabs a { padding:10px 4px; border-radius:9px; text-align:center; font-size:12.5px; font-weight:700; color:var(--muted); white-space:nowrap; }
        .reservation-filter-tabs a.is-active { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.08); }
        .reservation-filter-tabs a:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
        .reservation-row-badges { display:flex; flex:none; flex-direction:column; align-items:flex-end; gap:6px; }
        .badge-use-before { background:#eef8f2; color:var(--green-dark); }
        .badge-use-now { background:#fff3d8; color:#8a5a00; }
        .badge-use-after { background:#f0f1f3; color:var(--muted); }
    </style>

    <div class="topbar has-line">
        <a class="topbar-back" data-history-back th:href="@{/mypage}" aria-label="마이페이지로 돌아가기">
            <span class="ico" aria-hidden="true">arrow_back_ios_new</span>
        </a>
        <h1>예약 목록</h1>
    </div>

    <div class="screen">
        <div class="notice notice-danger" role="alert" th:if="${cancelError}" th:text="${cancelError}"></div>

        <nav class="reservation-filter-tabs" aria-label="예약 이용상태 필터">
            <a th:href="@{/reservation/list}"
               th:classappend="${param.useStatus == null} ? ' is-active'">전체</a>
            <a th:href="@{/reservation/list(useStatus='BEFORE_USE')}"
               th:classappend="${param.useStatus != null and param.useStatus[0] == 'BEFORE_USE'} ? ' is-active'">이용 전</a>
            <a th:href="@{/reservation/list(useStatus='IN_USE')}"
               th:classappend="${param.useStatus != null and param.useStatus[0] == 'IN_USE'} ? ' is-active'">이용 중</a>
            <a th:href="@{/reservation/list(useStatus='AFTER_USE')}"
               th:classappend="${param.useStatus != null and param.useStatus[0] == 'AFTER_USE'} ? ' is-active'">이용 완료</a>
        </nav>

        <div class="empty" th:if="${#lists.isEmpty(reservations)}">
            <span class="ico" aria-hidden="true">event_busy</span>
            <strong>조회된 예약 내역이 없어요</strong>
            <p>마음에 드는 돌봄 공간을 찾아 첫 예약을 남겨보세요.</p>
            <a class="btn btn-primary" th:href="@{/places}">돌봄 공간 둘러보기</a>
        </div>

        <!--/*
          예약 카드. 한 줄에 욱여넣으면 상태 뱃지가 줄바꿈되고 카드마다 높이가 달라진다.
          그래서 카드를 세로로 넉넉히 띄우고, 뱃지는 줄지 않게(flex:none) 고정한다. (#7)
        */-->
        <div class="card-stack" th:unless="${#lists.isEmpty(reservations)}">
            <div class="card reservation-card" th:each="reservation : ${reservations}">
                <span class="reservation-card-copy">
                    <a class="reservation-card-title" th:if="${reservation.placeId != null}"
                       th:href="@{/places/{id}(id=${reservation.placeId})}"
                       th:text="${reservation.placeName}">연남동 윤슬 호스트</a>
                    <strong class="reservation-card-title" th:unless="${reservation.placeId != null}"
                            th:text="${reservation.placeName}">연남동 윤슬 호스트</strong>
                    <span class="reservation-card-when">
                        <span class="ico" aria-hidden="true">calendar_today</span>
                        <span th:text="${reservation.checkIn != null
                                         ? #temporals.format(reservation.checkIn, 'M월 d일 HH:mm')
                                         : '일정 미정'}">8월 5일 12:00</span>
                        <th:block th:if="${reservation.checkIn != null and reservation.checkOut != null}">
                            <span aria-hidden="true">—</span>
                            <!--/* 같은 날이면 끝나는 시각만, 날을 넘기면 날짜까지 보여준다 */-->
                            <span th:text="${#temporals.format(reservation.checkIn, 'yyyy-MM-dd')
                                              == #temporals.format(reservation.checkOut, 'yyyy-MM-dd')
                                             ? #temporals.format(reservation.checkOut, 'HH:mm')
                                             : #temporals.format(reservation.checkOut, 'M월 d일 HH:mm')}">20:00</span>
                        </th:block>
                    </span>
                    <span class="reservation-card-price" th:if="${reservation.totalPrice != null}"
                          th:text="${#numbers.formatInteger(reservation.totalPrice, 0, 'COMMA')} + '원'">48,000원</span>
                </span>

                <span class="reservation-card-actions">
                    <span class="reservation-row-badges">
                        <span class="badge reservation-card-badge" th:if="${reservation.reservationUseStatus != null}"
                              th:classappend="${reservation.reservationUseStatus.name() == 'BEFORE_USE' ? 'badge-use-before'
                                              : (reservation.reservationUseStatus.name() == 'IN_USE' ? 'badge-use-now' : 'badge-use-after')}"
                              th:text="${reservation.reservationUseStatus.name() == 'BEFORE_USE' ? '이용 전'
                                       : (reservation.reservationUseStatus.name() == 'IN_USE' ? '이용 중' : '이용 완료')}">이용 전</span>
                        <span class="badge reservation-card-badge"
                              th:classappend="${reservation.reservationStatus?.name() == 'CONFIRMED' ? 'badge-green'
                                              : (reservation.reservationStatus?.name() == 'CANCELED' ? 'badge-danger' : 'badge-warn')}"
                              th:text="${reservation.reservationStatus?.name() == 'CONFIRMED' ? '예약 확정'
                                       : (reservation.reservationStatus?.name() == 'CANCELED' ? '취소됨' : '응답 대기')}">응답 대기</span>
                    </span>
                    <a class="reservation-card-detail"
                       th:href="@{/reservation/detail(reservationId=${reservation.reservationId})}">예약 상세 보기</a>
                </span>
            </div>
        </div>
    </div>
</main>
</body>
</html>
