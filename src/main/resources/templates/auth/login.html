<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#22a45c">
    <meta name="description" content="Pet NOW에 로그인하고 우리 아이의 돌봄을 이어가세요.">
    <title>로그인 | Pet NOW</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../../static/css/pet-now.css" th:href="@{/css/pet-now.css}">
    <link rel="stylesheet" href="../../static/css/auth.css" th:href="@{/css/auth.css}">
    <script defer src="../../static/js/auth.js" th:src="@{/js/auth.js}"></script>
</head>
<body class="auth-page">
<a class="skip-link" href="#auth-form">로그인 폼으로 바로가기</a>

<header class="auth-header">
    <a class="brand" href="/places" aria-label="Pet NOW 홈">
        <span class="brand-mark material-symbols-rounded" aria-hidden="true">pets</span>
        <span>Pet <b>NOW</b></span>
    </a>
</header>

<main class="auth-main" id="main-content">
    <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">WELCOME BACK</p>
        <h1 id="auth-title">다시 만나서 반가워요.</h1>
        <p class="auth-sub">로그인하고 우리 아이의 돌봄을 이어가세요.</p>

        <div class="auth-banner is-success" role="status" th:if="${registered}">
            <span class="material-symbols-rounded" aria-hidden="true">check_circle</span>
            <span>회원가입이 완료됐어요. 로그인해주세요.</span>
        </div>

        <form id="auth-form" th:action="@{/auth/login}" th:object="${userLoginRequest}" method="post" novalidate>
            <div class="auth-banner is-error" role="alert" th:if="${#fields.hasErrors('global')}">
                <span class="material-symbols-rounded" aria-hidden="true">error</span>
                <span th:each="err : ${#fields.errors('global')}" th:text="${err}">이메일 또는 비밀번호가 일치하지 않습니다.</span>
            </div>

            <div class="field">
                <label class="field-label" for="email">이메일</label>
                <input class="control" id="email" type="email" th:field="*{email}" th:errorclass="has-error"
                       autocomplete="email" inputmode="email" placeholder="you@petnow.kr"
                       aria-describedby="email-error" th:aria-invalid="${#fields.hasErrors('email')}" required>
                <p class="field-error" id="email-error" th:errors="*{email}"></p>
            </div>

            <div class="field">
                <label class="field-label" for="password">비밀번호</label>
                <div class="password-control">
                    <input class="control" id="password" type="password" th:field="*{password}" th:errorclass="has-error"
                           autocomplete="current-password" placeholder="비밀번호를 입력해주세요"
                           aria-describedby="password-error" th:aria-invalid="${#fields.hasErrors('password')}"
                           data-password-input required>
                    <button class="password-toggle" type="button" data-password-toggle aria-pressed="false"
                            aria-controls="password" aria-label="비밀번호 표시">
                        <span class="material-symbols-rounded" aria-hidden="true" data-password-icon>visibility</span>
                    </button>
                </div>
                <p class="field-error" id="password-error" th:errors="*{password}"></p>
            </div>

            <button class="auth-submit" type="submit">로그인</button>
        </form>

        <div class="auth-divider" role="separator"><span>또는</span></div>

        <button class="kakao-button" type="button" aria-disabled="true" data-kakao-button>
            <span class="material-symbols-rounded" aria-hidden="true">chat_bubble</span>
            <span>카카오로 계속하기</span>
        </button>

        <p class="auth-switch">아직 계정이 없으신가요? <a href="/auth/signup" th:href="@{/auth/signup}">회원가입</a></p>
    </section>
</main>

<div class="toast" data-auth-toast role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
