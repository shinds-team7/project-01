<!DOCTYPE html>
<!--/*
  로그인. 프로토타입(PetNow.dc.html)에는 인증 화면이 없어서 앱 셸의 폼 조각으로 맞췄다.

  #117 에서 넣은 BindingResult 폼 에러 처리(global 에러 배너, 필드 에러, registered 배너)를
  그대로 유지한다. 마크업만 app.css 로 옮겼고 서버와 주고받는 값은 바뀐 게 없다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: page('로그인', 'none', ~{::main})}">
<body>
<main id="main-content" class="app-main no-nav auth-screen">
    <div class="auth-card">
        <a class="auth-brand" th:href="@{/home}" aria-label="Pet NOW 홈">
            <span class="ico is-filled" aria-hidden="true">pets</span><span>Pet NOW</span>
        </a>

        <p class="auth-kicker">WELCOME BACK</p>
        <h1>다시 만나서 반가워요</h1>
        <p class="auth-sub">로그인하고 우리 아이의 돌봄을 이어가세요.</p>

        <div class="notice notice-green" role="status" th:if="${registered}">
            <span class="ico" aria-hidden="true">check_circle</span>
            <span>회원가입이 완료됐어요. 로그인해주세요.</span>
        </div>

        <form th:action="@{/auth/login}" th:object="${userLoginRequest}" method="post" novalidate>
            <div class="notice notice-danger" role="alert" th:if="${#fields.hasErrors('global')}">
                <span class="ico" aria-hidden="true">error</span>
                <span th:each="err : ${#fields.errors('global')}" th:text="${err}">이메일 또는 비밀번호가 일치하지 않습니다.</span>
            </div>

            <div class="field">
                <label class="field-label" for="email">이메일</label>
                <input class="control" id="email" type="email" th:field="*{email}" th:errorclass="has-error"
                       autocomplete="email" inputmode="email" placeholder="you@petnow.kr"
                       aria-describedby="email-error" th:aria-invalid="${#fields.hasErrors('email')}" required>
                <p class="field-error" id="email-error" th:errors="*{email}"></p>
            </div>

            <div class="field">
                <label class="field-label" for="password">비밀번호</label>
                <div class="password-control">
                    <input class="control" id="password" type="password" th:field="*{password}" th:errorclass="has-error"
                           autocomplete="current-password" placeholder="비밀번호를 입력해주세요"
                           aria-describedby="password-error" th:aria-invalid="${#fields.hasErrors('password')}"
                           data-password-input required>
                    <button class="password-toggle" type="button" data-password-toggle aria-pressed="false"
                            aria-controls="password" aria-label="비밀번호 표시">
                        <span class="ico" aria-hidden="true" data-password-icon>visibility</span>
                    </button>
                </div>
                <p class="field-error" id="password-error" th:errors="*{password}"></p>
            </div>

            <button class="btn btn-dark btn-block" type="submit">로그인</button>
        </form>

        <div class="auth-divider" role="separator"><span>또는</span></div>

        <a class="btn btn-block kakao-btn" th:href="@{/auth/kakao}">
            <span class="ico" aria-hidden="true">chat_bubble</span>
            <span>카카오톡 로그인</span>
        </a>

        <p class="auth-switch">아직 계정이 없으신가요? <a th:href="@{/auth/signup}">회원가입</a></p>
    </div>

    <div class="toast" data-auth-toast role="status" aria-live="polite" aria-atomic="true"></div>

    <!--/*
      fragments/base 에는 화면별 스크립트 자리가 없다. <main> 끝에 두면 위 마크업이
      모두 파싱된 뒤 실행되므로 defer 없이도 안전하다.
    */-->
    <script th:src="@{/js/auth.js}"></script>
</main>
</body>
</html>
