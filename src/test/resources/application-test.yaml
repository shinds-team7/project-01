# 테스트 전용 설정.
# 목적: 클린 클론(= application-local.yaml 이 없는 환경)과 CI 에서도
#       ./gradlew test 가 로컬 MariaDB 없이 그대로 통과하게 한다.
# 주의: 테스트는 절대 local 프로파일에 의존하지 않는다. local 은 개인 DB 계정이 들어가는
#       .gitignore 대상이라 새 팀원/CI 에는 존재하지 않는다.
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:petnow-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  # 마이그레이션(V1~V8)은 MariaDB 전용 문법(ENUM 등)이라 H2 에서 돌지 않는다.
  # 컨텍스트 로딩 검증에는 스키마가 필요 없으므로 끈다.
  # 실제 스키마/쿼리를 검증하는 Mapper 통합 테스트를 붙일 때는
  # Testcontainers(MariaDB) 로 전환할 것.
  flyway:
    enabled: false

logging:
  level:
    root: warn
    com.example.petnow: info
