name: CD

on:
  push:
    branches: [main]        # develop 이 아니라 main 머지에만 배포한다.
  # 재배포/롤백을 손으로 돌릴 수 있게 열어둔다. 이 단계의 검증도 여기서 한다.
  workflow_dispatch:

# 배포는 절대 겹치면 안 된다. 겹치면 EC2 에서 두 개의 compose 가 동시에 뜬다.
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # GHCR push 용. GITHUB_TOKEN 이 자동으로 받는다.

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 여기서 만든 jar 하나가 도커 이미지에 들어가고, 5/5 에서는 S3 에도 같이 올라간다.
      # 테스트는 CI 워크플로가 이미 돌렸으므로 다시 돌리지 않는다.
      - name: Build jar
        run: ./gradlew bootJar --no-daemon -x test

      - name: Resolve jar path
        id: jar
        run: echo "path=$(ls build/libs/*.jar | head -n1)" >> "$GITHUB_OUTPUT"

      # --- 이미지 빌드 & GHCR push --------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            JAR_FILE=${{ steps.jar.outputs.path }}
          # SHA 태그는 롤백용, latest 는 사람이 보기 편하라고 같이 단다.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 여기서부터는 4/5 에서 이어 붙입니다 (EC2 배포 · 스모크 테스트) ---
